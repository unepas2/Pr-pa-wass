<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bilan développemental indicatif (3–12 mois)</title>
<meta name="description" content="Estimation à l'aveugle de l'âge développemental d'un bébé (3 à 12 mois) puis comparaison avec l'âge réel. Outil indicatif, non médical.">
<style>
  :root{
    --bg:#f4f7fb;
    --card:#ffffff;
    --ink:#28324a;
    --muted:#6b7892;
    --primary:#5b8def;
    --primary-d:#3f6fd1;
    --accent:#7dc4a5;
    --warm:#f6b26b;
    --soft:#eef3fb;
    --green:#5fb98a;
    --amber:#e9a83a;
    --red:#e07a6f;
    --violet:#9b8ad6;
    --radius:18px;
    --shadow:0 10px 30px rgba(40,50,74,.08);
    --shadow-sm:0 4px 14px rgba(40,50,74,.07);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:'Segoe UI',system-ui,-apple-system,Tahoma,sans-serif;
    color:var(--ink);
    background:linear-gradient(180deg,#eaf1fb 0%,var(--bg) 240px);
    line-height:1.55;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:880px;margin:0 auto;padding:24px 18px 80px}
  header.app{text-align:center;padding:26px 12px 8px}
  header.app .logo{font-size:42px;line-height:1}
  header.app h1{font-size:1.5rem;margin:.4rem 0 .2rem;font-weight:700}
  header.app p.sub{color:var(--muted);font-size:.95rem;max-width:560px;margin:0 auto}
  .disclaimer-top{
    background:#fff7ec;border:1px solid #f6e2c4;color:#8a6a33;
    border-radius:12px;padding:10px 14px;font-size:.82rem;margin:16px auto 0;max-width:620px;text-align:center;
  }
  .card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:26px;margin:18px 0}
  .card h2{font-size:1.25rem;margin-bottom:.5rem}
  .card h3{font-size:1.05rem;margin:1.2rem 0 .5rem}
  .muted{color:var(--muted)}
  .center{text-align:center}
  /* Buttons */
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:.5rem;
    border:none;border-radius:12px;padding:14px 22px;font-size:1rem;font-weight:600;
    cursor:pointer;transition:transform .15s ease,box-shadow .15s ease,background .2s;
    text-decoration:none;
  }
  .btn:active{transform:translateY(1px)}
  .btn-primary{background:var(--primary);color:#fff;box-shadow:0 6px 16px rgba(91,141,239,.35)}
  .btn-primary:hover{background:var(--primary-d)}
  .btn-ghost{background:var(--soft);color:var(--primary-d)}
  .btn-ghost:hover{background:#e2ebfa}
  .btn-block{width:100%}
  .btn-row{display:flex;gap:12px;flex-wrap:wrap;margin-top:16px}
  .btn-row .btn{flex:1;min-width:160px}
  /* Mode selection */
  .mode-card{
    border:2px solid var(--soft);border-radius:16px;padding:20px;cursor:pointer;
    transition:border-color .2s,box-shadow .2s,transform .15s;margin-top:14px;text-align:left;
    display:block;width:100%;background:#fff;
  }
  .mode-card:hover{border-color:var(--primary);box-shadow:var(--shadow-sm);transform:translateY(-2px)}
  .mode-card .tag{display:inline-block;font-size:.72rem;font-weight:700;color:#fff;background:var(--accent);
    border-radius:20px;padding:3px 10px;margin-bottom:8px}
  .mode-card h3{margin:0 0 .3rem;font-size:1.08rem}
  .mode-card p{color:var(--muted);font-size:.9rem}
  /* Progress */
  .progress{height:10px;background:var(--soft);border-radius:20px;overflow:hidden;margin:6px 0 4px}
  .progress > i{display:block;height:100%;background:linear-gradient(90deg,var(--primary),var(--accent));width:0;transition:width .3s}
  .progress-label{font-size:.8rem;color:var(--muted);text-align:right;margin-bottom:14px}
  .domain-pill{display:inline-block;font-size:.78rem;font-weight:600;color:var(--primary-d);
    background:var(--soft);border-radius:20px;padding:4px 12px;margin-bottom:14px}
  /* Question */
  .question h2{font-size:1.3rem;line-height:1.4;margin:6px 0 18px}
  .answers{display:flex;flex-direction:column;gap:12px}
  .ans{
    border:2px solid var(--soft);background:#fff;border-radius:14px;padding:16px 18px;font-size:1.02rem;
    font-weight:600;cursor:pointer;text-align:left;transition:all .15s;display:flex;align-items:center;gap:12px;
  }
  .ans .em{font-size:1.3rem}
  .ans.yes:hover{border-color:var(--green);background:#f0fbf5}
  .ans.no:hover{border-color:var(--warm);background:#fff7ee}
  .ans.unknown:hover{border-color:var(--violet);background:#f6f4fd}
  .quiz-foot{display:flex;justify-content:space-between;align-items:center;margin-top:20px}
  .link-btn{background:none;border:none;color:var(--muted);cursor:pointer;font-size:.9rem;text-decoration:underline}
  /* Result big number */
  .age-hero{text-align:center;padding:8px 0 4px}
  .age-hero .big{font-size:3rem;font-weight:800;color:var(--primary-d);line-height:1}
  .age-hero .big small{font-size:1.1rem;font-weight:600;color:var(--muted)}
  .age-hero .range{color:var(--muted);margin-top:6px;font-size:1rem}
  .conf{display:inline-flex;align-items:center;gap:8px;margin-top:12px;font-weight:600;font-size:.9rem;
    padding:6px 14px;border-radius:20px}
  .conf.eleve{background:#eaf7f0;color:#2f8a5e}
  .conf.moyen{background:#fbf2e0;color:#a9791f}
  .conf.faible{background:#fbece9;color:#bf5042}
  /* Domain bars */
  .bars{margin-top:8px}
  .bar-row{margin:14px 0}
  .bar-row .lab{display:flex;justify-content:space-between;font-size:.9rem;margin-bottom:5px}
  .bar-row .lab .age{font-weight:700;color:var(--primary-d)}
  .track{position:relative;height:16px;background:var(--soft);border-radius:20px;overflow:visible}
  .track > i{display:block;height:100%;border-radius:20px;background:linear-gradient(90deg,var(--primary),var(--accent));
    transition:width .5s}
  .track .refline{position:absolute;top:-5px;bottom:-5px;width:3px;background:var(--red);border-radius:3px}
  .track .refline::after{content:'âge réel';position:absolute;top:-18px;left:50%;transform:translateX(-50%);
    font-size:.62rem;color:var(--red);white-space:nowrap;font-weight:700}
  .scale{display:flex;justify-content:space-between;font-size:.68rem;color:var(--muted);margin-top:2px}
  /* Lists */
  ul.clean{list-style:none;margin:6px 0}
  ul.clean li{padding:8px 0 8px 28px;position:relative;border-bottom:1px solid #f0f3f8;font-size:.95rem}
  ul.clean li:last-child{border-bottom:none}
  ul.clean li::before{position:absolute;left:0;top:8px}
  ul.yes li::before{content:'✅'}
  ul.no li::before{content:'•';color:var(--warm);font-size:1.4rem;top:2px}
  ul.unk li::before{content:'❔'}
  ul.activity li::before{content:'🎯'}
  ul.strong li::before{content:'⭐'}
  ul.watch li::before{content:'👀'}
  ul.alert li::before{content:'⚑';color:var(--red)}
  .prudence{background:var(--soft);border-left:4px solid var(--primary);border-radius:10px;
    padding:12px 16px;font-size:.9rem;color:var(--ink);margin-top:18px}
  /* Transition / form */
  .field{margin:16px 0}
  .field label{display:block;font-weight:600;margin-bottom:6px}
  .field .hint{font-weight:400;color:var(--muted);font-size:.85rem}
  .inputs{display:flex;gap:12px;flex-wrap:wrap}
  input[type=number]{
    width:110px;padding:12px 14px;border:2px solid var(--soft);border-radius:12px;font-size:1rem;font-family:inherit;
  }
  input[type=number]:focus{outline:none;border-color:var(--primary)}
  .radio-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
  .radio-chip{border:2px solid var(--soft);border-radius:12px;padding:10px 16px;cursor:pointer;font-weight:600;transition:all .15s}
  .radio-chip:hover{border-color:var(--primary)}
  .radio-chip.sel{border-color:var(--primary);background:var(--soft);color:var(--primary-d)}
  .corrected-note{background:#eaf7f0;border-radius:10px;padding:10px 14px;color:#2f8a5e;font-size:.9rem;margin-top:10px;display:none}
  /* Bilan summary */
  .summary-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:8px}
  .stat{background:var(--soft);border-radius:14px;padding:16px;text-align:center}
  .stat .k{font-size:.8rem;color:var(--muted);font-weight:600}
  .stat .v{font-size:1.5rem;font-weight:800;color:var(--primary-d);margin-top:2px}
  .stat .v small{font-size:.8rem;color:var(--muted);font-weight:600}
  .badge{display:inline-flex;align-items:center;gap:8px;font-weight:700;padding:10px 18px;border-radius:30px;font-size:1rem;margin-top:6px}
  .badge.coherent{background:#eaf7f0;color:#2f8a5e}
  .badge.avance1{background:#eaf2fd;color:var(--primary-d)}
  .badge.avance2{background:#e9e6f8;color:#6a59b8}
  .badge.hetero{background:#fdf1e6;color:#b9761f}
  .badge.observer{background:#fbf2e0;color:#a9791f}
  .badge.pro{background:#fbece9;color:#bf5042}
  .index-meter{margin-top:14px}
  .index-meter .bartrack{height:14px;border-radius:20px;overflow:hidden;background:linear-gradient(90deg,#e07a6f 0%,#e9a83a 28%,#5fb98a 45% 60%,#5b8def 78%,#9b8ad6 100%)}
  .index-meter .marker{position:relative;height:0}
  .index-meter .marker > span{position:absolute;top:-30px;transform:translateX(-50%);background:var(--ink);color:#fff;
    font-size:.72rem;font-weight:700;padding:2px 8px;border-radius:8px;white-space:nowrap}
  .index-meter .marker > span::after{content:'';position:absolute;bottom:-5px;left:50%;transform:translateX(-50%);
    border:5px solid transparent;border-top-color:var(--ink)}
  .conclusion{font-size:1.02rem;line-height:1.7}
  .section-note{font-size:.85rem;color:var(--muted)}
  .when-box{background:#fbf6f5;border:1px solid #f3dad5;border-radius:14px;padding:16px}
  .when-box.flagged{background:#fbece9;border-color:#e8b9b1}
  footer.app{text-align:center;color:var(--muted);font-size:.78rem;padding:30px 12px 0}
  .hidden{display:none!important}
  @media(max-width:560px){
    .summary-grid{grid-template-columns:1fr}
    header.app h1{font-size:1.25rem}
    .age-hero .big{font-size:2.4rem}
  }
  @media print{
    body{background:#fff}
    .no-print{display:none!important}
    .card{box-shadow:none;border:1px solid #e4e9f2;page-break-inside:avoid}
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="app">
    <div class="logo">👶</div>
    <h1>Bilan développemental indicatif</h1>
    <p class="sub">Pour les bébés de 3 à 12 mois — une estimation d'âge développemental, puis une analyse personnalisée bienveillante.</p>
  </header>

  <div id="app"></div>

  <footer class="app no-print">
    Outil indicatif et non médical — il ne pose aucun diagnostic.<br>
    En cas de doute, parlez-en à votre pédiatre, votre médecin ou votre PMI.
  </footer>
</div>

<script>
"use strict";

/* ============================================================
   DONNÉES — Jalons développementaux (3 à 12 mois)
   age = âge (en mois) auquel l'acquisition est typiquement observée
   central = jalon "central" pour son âge (utilisé pour le repérage)
============================================================ */
const DOMAINS = {
  global:   { label:"Motricité globale",     emoji:"🤸", color:"#5b8def" },
  fine:     { label:"Motricité fine",        emoji:"✋", color:"#7dc4a5" },
  langage:  { label:"Langage & communication", emoji:"💬", color:"#f6b26b" },
  cognition:{ label:"Compréhension & exploration", emoji:"🔍", color:"#9b8ad6" },
  social:   { label:"Interactions sociales & émotions", emoji:"💞", color:"#e07a6f" }
};
const DOMAIN_ORDER = ["global","fine","langage","cognition","social"];

const MILESTONES = [
  // --- Motricité globale ---
  {id:"g3", d:"global", age:3,  t:"Tient bien sa tête droite quand on le porte", central:true},
  {id:"g4", d:"global", age:4,  t:"Se redresse sur les avant-bras quand il est à plat ventre"},
  {id:"g5", d:"global", age:5,  t:"Se retourne du ventre vers le dos (ou inversement)"},
  {id:"g6", d:"global", age:6,  t:"Tient assis avec un léger appui", central:true},
  {id:"g7", d:"global", age:7,  t:"Tient assis sans appui quelques instants"},
  {id:"g8", d:"global", age:8,  t:"Tient assis bien stable tout seul", central:true},
  {id:"g9", d:"global", age:9,  t:"Se déplace au sol (rampe, se met à quatre pattes)"},
  {id:"g10",d:"global", age:10, t:"Se met debout en se tenant à un appui"},
  {id:"g11",d:"global", age:11, t:"Se déplace en se tenant aux meubles"},
  {id:"g12",d:"global", age:12, t:"Tient debout seul quelques instants"},

  // --- Motricité fine ---
  {id:"f3", d:"fine", age:3,  t:"Ouvre et ferme les mains, regarde ses mains"},
  {id:"f4", d:"fine", age:4,  t:"Attrape un objet placé près de lui et le porte à la bouche"},
  {id:"f5", d:"fine", age:5,  t:"Attrape volontairement un objet tendu", central:true},
  {id:"f6", d:"fine", age:6,  t:"Passe un objet d'une main à l'autre"},
  {id:"f7", d:"fine", age:7,  t:"Tient un objet dans chaque main"},
  {id:"f8", d:"fine", age:8,  t:"Saisit de petits objets avec plusieurs doigts"},
  {id:"f9", d:"fine", age:9,  t:"Commence à pincer entre le pouce et l'index", central:true},
  {id:"f10",d:"fine", age:10, t:"Utilise une pince fine pouce-index efficace"},
  {id:"f11",d:"fine", age:11, t:"Relâche volontairement un objet qu'il tient"},
  {id:"f12",d:"fine", age:12, t:"Met des objets dans un contenant"},

  // --- Langage & communication ---
  {id:"l3", d:"langage", age:3,  t:"Gazouille, émet des petits sons (areu)", central:true},
  {id:"l4", d:"langage", age:4,  t:"Rit aux éclats, vocalise en réponse à la voix"},
  {id:"l5", d:"langage", age:5,  t:"Réagit aux sons et tourne la tête vers une voix", central:true},
  {id:"l6", d:"langage", age:6,  t:"Babille en répétant des sons (eh, oh, ba)"},
  {id:"l7", d:"langage", age:7,  t:"Babille avec des syllabes variées (ba, da, ma)"},
  {id:"l8", d:"langage", age:8,  t:"Babille avec des intonations différentes"},
  {id:"l9", d:"langage", age:9,  t:"Répète des suites de syllabes (bababa, dadada)", central:true},
  {id:"l10",d:"langage", age:10, t:"Réagit à son prénom de façon régulière", central:true},
  {id:"l11",d:"langage", age:11, t:"Comprend un mot familier simple (ex. « non »)"},
  {id:"l12",d:"langage", age:12, t:"Dit un premier mot avec du sens / fait « au revoir » de la main"},

  // --- Compréhension & exploration (cognition) ---
  {id:"c3", d:"cognition", age:3,  t:"Suit un objet ou un visage du regard"},
  {id:"c4", d:"cognition", age:4,  t:"Explore les objets avec la bouche"},
  {id:"c5", d:"cognition", age:5,  t:"Cherche du regard la source d'un son"},
  {id:"c6", d:"cognition", age:6,  t:"Examine les objets, les tourne dans ses mains", central:true},
  {id:"c7", d:"cognition", age:7,  t:"Tape ou secoue un objet pour faire du bruit"},
  {id:"c8", d:"cognition", age:8,  t:"Cherche un objet qui vient de tomber / d'être à demi caché"},
  {id:"c9", d:"cognition", age:9,  t:"Cherche un objet entièrement caché (permanence de l'objet)", central:true},
  {id:"c10",d:"cognition", age:10, t:"Imite un geste simple (taper des mains, frapper deux objets)"},
  {id:"c11",d:"cognition", age:11, t:"Comprend une consigne très simple avec le geste"},
  {id:"c12",d:"cognition", age:12, t:"Joue volontairement à des jeux de cause à effet / pointe du doigt"},

  // --- Interactions sociales & émotionnelles ---
  {id:"s3", d:"social", age:3,  t:"Sourit en réponse quand on lui parle (sourire social)", central:true},
  {id:"s4", d:"social", age:4,  t:"Manifeste clairement plaisir et déplaisir"},
  {id:"s5", d:"social", age:5,  t:"Reconnaît et distingue les visages familiers"},
  {id:"s6", d:"social", age:6,  t:"Tend les bras ou réagit pour être pris", central:true},
  {id:"s7", d:"social", age:7,  t:"Aime jouer à « coucou » et cherche l'interaction"},
  {id:"s8", d:"social", age:8,  t:"Montre de la méfiance ou de la gêne face aux inconnus"},
  {id:"s9", d:"social", age:9,  t:"Cherche le regard de l'adulte et partage son attention", central:true},
  {id:"s10",d:"social", age:10, t:"Imite des mimiques, fait « coucou » ou « bravo » de la main"},
  {id:"s11",d:"social", age:11, t:"Cherche activement à attirer votre attention"},
  {id:"s12",d:"social", age:12, t:"Joue à des jeux d'échange (donner / reprendre un objet)"}
];

/* Questions de repérage (indépendantes de l'âge ou évaluées avec l'âge réel).
   answer: 'oui' = situation rassurante par défaut, 'non'/'inquiet' = signal possible */
const FLAG_QUESTIONS = [
  {id:"flag_loss", t:"Avez-vous remarqué que votre enfant a perdu une compétence qu'il savait déjà faire ?",
   alertIf:"oui", text:"Perte d'une compétence déjà acquise"},
  {id:"flag_sound", t:"Votre enfant réagit-il aux sons et aux bruits de son environnement ?",
   alertIf:"non", text:"Absence de réaction aux sons"},
  {id:"flag_social", t:"Votre enfant cherche-t-il le contact et l'interaction avec vous (regard, sourire, voix) ?",
   alertIf:"non", text:"Absence importante d'interaction"},
  {id:"flag_asym", t:"Remarquez-vous une asymétrie marquée (il n'utilise presque qu'un seul côté du corps) ?",
   alertIf:"oui", text:"Asymétrie corporelle marquée"}
];

/* Activités conseillées par domaine (section 11) */
const ACTIVITIES = {
  global:[
    "Proposer du temps sur le ventre, plusieurs fois par jour, sous surveillance",
    "Placer un jouet légèrement hors de portée pour encourager le mouvement",
    "Laisser bébé bouger librement sur un tapis sécurisé",
    "Encourager les changements de position en douceur, sans forcer"
  ],
  fine:[
    "Proposer des objets faciles à attraper et de textures variées",
    "Proposer des jeux de transfert d'un objet d'une main à l'autre",
    "Proposer des contenants à remplir et à vider",
    "Encourager la prise de petits objets adaptés et sécurisés selon l'âge"
  ],
  langage:[
    "Parler souvent à bébé et nommer les objets du quotidien",
    "Répondre à ses sons et laisser des pauses pour qu'il réponde",
    "Chanter des comptines répétitives",
    "Jouer avec des syllabes simples (ba-ba, da-da)"
  ],
  cognition:[
    "Jouer à coucou-caché et cacher partiellement un objet",
    "Proposer des jeux de cause à effet (objet qui fait du bruit)",
    "Laisser bébé explorer sous surveillance",
    "Répéter les mêmes jeux pour favoriser l'apprentissage"
  ],
  social:[
    "Multiplier les échanges en face à face",
    "Imiter les mimiques et les sons de bébé",
    "Jouer à faire « coucou » et verbaliser les émotions",
    "Favoriser des routines rassurantes"
  ]
};

/* Formulations de points forts par domaine (section 9) */
const STRENGTHS = {
  global:"Bonne stabilité posturale et motricité globale bien installée pour son âge",
  fine:"Motricité fine bien installée et bonne coordination main-bouche",
  langage:"Communication sonore bien présente",
  cognition:"Curiosité marquée et exploration active des objets",
  social:"Interactions sociales riches et bonne capacité d'imitation"
};

/* Formulations de points à observer par domaine (section 10) */
const WATCH = {
  global:["Continuer à proposer du temps sur le ventre","Observer la stabilité assise dans les prochaines semaines","Observer si bébé utilise bien les deux côtés de son corps"],
  fine:["Encourager les manipulations d'objets simples","Proposer davantage de jeux de transfert d'objets"],
  langage:["Stimuler les échanges vocaux par des jeux de sons","Observer la réaction au prénom dans différents contextes","Encourager un babillage plus varié"],
  cognition:["Proposer davantage de jeux de coucou-caché et de cause à effet","Observer la recherche d'objets cachés"],
  social:["Proposer davantage de jeux d'imitation et d'échange en face à face","Observer la recherche du regard et du contact"]
};

/* ============================================================
   ÉTAT
============================================================ */
const state = {
  mode:null,            // 'blind' | 'direct'
  answers:{},           // id -> 'oui'|'non'|'idk'
  flags:{},             // flag id -> 'oui'|'non'
  realMonths:null,
  realDays:0,
  premature:null,       // 'non'|'oui'|'idk'
  premWeeks:0,
  estimate:null         // résultat calculé
};

const $app = document.getElementById('app');

/* ============================================================
   MOTEUR D'ESTIMATION (Phase 1 — à l'aveugle)
============================================================ */
function clamp(v,min,max){return Math.max(min,Math.min(max,v));}

function answerOf(id){ return state.answers[id] || 'unanswered'; }

function estimateDomain(domainKey){
  const ms = MILESTONES.filter(m=>m.d===domainKey).sort((a,b)=>a.age-b.age);
  const acquired=[], notyet=[], unknown=[];
  ms.forEach(m=>{
    const a = answerOf(m.id);
    if(a==='oui') acquired.push(m.age);
    else if(a==='non') notyet.push(m.age);
    else unknown.push(m.age); // idk + unanswered
  });
  const minAge = ms[0].age, maxAge = ms[ms.length-1].age;
  const ceiling = notyet.length ? Math.min(...notyet) : (maxAge+1);
  const belowCeiling = acquired.filter(a=>a<ceiling);
  const floor = belowCeiling.length ? Math.max(...belowCeiling) : (minAge-1);
  // acquisitions au-delà de la première lacune = avance partielle
  const advanced = acquired.filter(a=>a>=ceiling).length;
  let est = (floor + ceiling)/2 + advanced*0.3;
  est = clamp(est, 3, 12);
  const total = ms.length;
  const passRate = acquired.length/total;
  return {
    domain:domainKey, est, floor, ceiling,
    acquired, notyet, unknown, passRate,
    nUnknown:unknown.length, total
  };
}

function runEstimation(){
  const domains = {};
  DOMAIN_ORDER.forEach(k=> domains[k]=estimateDomain(k));
  const ests = DOMAIN_ORDER.map(k=>domains[k].est);
  const overall = ests.reduce((a,b)=>a+b,0)/ests.length;
  const minD = Math.min(...ests), maxD = Math.max(...ests);
  const spread = maxD - minD;

  // Confiance
  const totalQ = MILESTONES.length;
  const nUnknown = DOMAIN_ORDER.reduce((s,k)=>s+domains[k].nUnknown,0);
  const unknownRatio = nUnknown/totalQ;
  let confidence='élevé';
  if(unknownRatio>0.25 || spread>=4) confidence='moyen';
  if(unknownRatio>0.5 || spread>=6) confidence='faible';

  // Fourchette probable
  const pad = confidence==='faible'?1.5:(confidence==='moyen'?1:0.5);
  const rangeLow = clamp(Math.round(Math.min(overall-pad, minD)),3,12);
  const rangeHigh = clamp(Math.round(Math.max(overall+pad, maxD)),3,12);

  // Acquisitions
  const present=[], absent=[], uncertain=[];
  MILESTONES.forEach(m=>{
    const a=answerOf(m.id);
    if(a==='oui') present.push(m);
    else if(a==='non') absent.push(m);
    else if(a==='idk') uncertain.push(m);
  });

  // Signaux de repérage déclenchés
  const alerts=[];
  FLAG_QUESTIONS.forEach(f=>{
    if(state.flags[f.id]===f.alertIf) alerts.push(f.text);
  });

  return {
    domains, overall, roundedOverall:Math.round(overall*2)/2,
    minD, maxD, spread, confidence, unknownRatio,
    rangeLow, rangeHigh, present, absent, uncertain, alerts
  };
}

/* ============================================================
   COMPARAISON & CLASSIFICATION (Phase 2)
============================================================ */
function correctedAge(){
  if(state.premature==='oui' && state.premWeeks>0){
    const c = state.realMonths - state.premWeeks/4.345;
    return Math.max(0, Math.round(c*10)/10);
  }
  return null;
}

function referenceAge(){
  const corr = correctedAge();
  return (corr!==null) ? corr : state.realMonths;
}

function buildComparison(est){
  const ref = referenceAge();
  const index = Math.round(est.overall/ref*100);
  const diff = est.overall - ref; // positif = en avance
  const corr = correctedAge();

  // Âge-dépendants : jalons centraux non acquis pour l'âge de référence
  const ageDepAlerts=[];
  // pas de babillage vers 9-10 mois
  if(ref>=9 && answerOf('l9')==='non' && answerOf('l7')==='non')
    ageDepAlerts.push("Absence de babillage varié vers 9-10 mois");
  // pas de réaction au prénom vers 10-12 mois
  if(ref>=10 && answerOf('l10')==='non')
    ageDepAlerts.push("Absence de réaction au prénom vers 10-12 mois");
  // tenue de tête tardive
  if(ref>=5 && answerOf('g3')==='non')
    ageDepAlerts.push("Tenue de tête non acquise au-delà de l'âge attendu");

  const allAlerts = est.alerts.concat(ageDepAlerts);

  // domaines nettement sous l'âge de référence (>= 3 mois en dessous)
  const farBelow = DOMAIN_ORDER.filter(k=> est.domains[k].est <= ref-3);
  // domaines en avance (>= 1 mois au-dessus)
  const above = DOMAIN_ORDER.filter(k=> est.domains[k].est >= ref+1);

  // ----- Classification (section 8) -----
  let cat;
  if(allAlerts.length>0 || farBelow.length>=2){
    cat = CATS.pro;
  } else if(est.spread>=3 && above.length>=1 && farBelow.length>=1){
    cat = CATS.hetero;
  } else if(est.spread>=3 && est.maxD-est.minD>=3 &&
            DOMAIN_ORDER.some(k=>est.domains[k].est>=ref+0.5) &&
            DOMAIN_ORDER.some(k=>est.domains[k].est<=ref-2)){
    cat = CATS.hetero;
  } else if(diff>=2 && diff<=3.5 && above.length>=3 && est.confidence==='élevé'){
    cat = CATS.avance2;
  } else if(index>140){
    cat = CATS.avance2;
  } else if(diff>=1){
    cat = CATS.avance1;
  } else if(index<90){
    cat = CATS.observer;
  } else {
    cat = CATS.coherent;
  }

  return {ref, corr, index, diff, allAlerts, ageDepAlerts, farBelow, above, cat};
}

const CATS = {
  coherent:{id:"coherent",label:"Cohérent avec l'âge",badge:"coherent",emoji:"✅",
    msg:"Les acquisitions observées sont globalement cohérentes avec l'âge indiqué."},
  avance1:{id:"avance1",label:"Légèrement en avance",badge:"avance1",emoji:"🌱",
    msg:"Plusieurs acquisitions semblent apparaître un peu plus tôt que la moyenne. Cela peut traduire une avance dans certains domaines, tout en restant dans la variabilité normale du développement."},
  avance2:{id:"avance2",label:"Nettement en avance",badge:"avance2",emoji:"🚀",
    msg:"Les réponses suggèrent un profil nettement avancé sur plusieurs domaines. Cette conclusion reste indicative, car les acquisitions précoces ne prédisent pas à elles seules le développement futur."},
  hetero:{id:"hetero",label:"Profil hétérogène",badge:"hetero",emoji:"🧩",
    msg:"Le profil semble hétérogène : certains domaines paraissent plus avancés, tandis que d'autres sont moins installés. Ce type de variation peut être normal, mais il mérite une observation attentive."},
  observer:{id:"observer",label:"Points à observer",badge:"observer",emoji:"👀",
    msg:"Certains éléments semblent moins installés que ce qui est fréquemment observé à cet âge. Il peut être utile de les observer dans les prochaines semaines et d'en parler à un professionnel si cela persiste."},
  pro:{id:"pro",label:"Avis professionnel recommandé",badge:"pro",emoji:"🩺",
    msg:"Certaines réponses méritent un avis professionnel. L'application ne peut pas interpréter seule ces éléments. Il est recommandé d'en parler à un pédiatre, une PMI ou un professionnel de santé."}
};

/* Interprétation de l'indice (section 6) */
function indexReading(index){
  if(index>140) return "profil très avancé, à interpréter avec prudence";
  if(index>=126) return "profil nettement en avance sur plusieurs acquisitions";
  if(index>=111) return "profil légèrement en avance";
  if(index>=90)  return "profil globalement cohérent avec l'âge";
  if(index>=75)  return "certains domaines sont à observer";
  return "plusieurs éléments méritent d'être discutés avec un professionnel";
}

/* ============================================================
   GÉNÉRATION DE LA SYNTHÈSE (moteur local, sans diagnostic)
   Reproduit la logique du prompt système décrit à la section 14.
============================================================ */
function domainName(k){ return DOMAINS[k].label.toLowerCase(); }

function buildStrengths(est, cmp){
  const out=[];
  DOMAIN_ORDER.forEach(k=>{
    const d=est.domains[k];
    const isStrong = (d.est >= cmp.ref+0.5) || (d.passRate>=0.8);
    if(isStrong) out.push(STRENGTHS[k]);
  });
  return out;
}

function buildWatch(est, cmp){
  const out=[];
  DOMAIN_ORDER.forEach(k=>{
    const d=est.domains[k];
    const lowerThanPeers = d.est <= est.maxD-2;
    const belowRef = d.est < cmp.ref-0.5;
    const manyNotYet = d.notyet.length>=2;
    const manyUnknown = d.nUnknown>=3;
    if(belowRef || lowerThanPeers || manyNotYet || manyUnknown){
      // choisir 1-2 formulations de ce domaine
      const list = WATCH[k];
      out.push(list[0]);
      if((belowRef && manyNotYet) && list[1]) out.push(list[1]);
    }
  });
  return [...new Set(out)];
}

function buildActivities(est, cmp){
  // domaines à accompagner = ceux ayant généré un point à observer
  const toSupport = DOMAIN_ORDER.filter(k=>{
    const d=est.domains[k];
    return (d.est < cmp.ref-0.5) || (d.est <= est.maxD-2) || d.notyet.length>=2;
  });
  let acts=[];
  if(toSupport.length===0){
    // profil cohérent / en avance : activités d'enrichissement générales
    acts = [ACTIVITIES.cognition[0], ACTIVITIES.social[0], ACTIVITIES.langage[1], ACTIVITIES.fine[0], ACTIVITIES.global[1]];
  } else {
    toSupport.forEach(k=>{ acts = acts.concat(ACTIVITIES[k].slice(0,2)); });
  }
  return [...new Set(acts)].slice(0,7);
}

function buildConclusion(est, cmp){
  const strongNames = cmp.above.map(domainName);
  const strongTxt = strongNames.length ? (" Certains domaines semblent plus avancés, notamment "+listFr(strongNames)+".") : "";
  switch(cmp.cat.id){
    case "coherent":
      return "Les réponses indiquent un profil développemental globalement cohérent avec l'âge de l'enfant. Les acquisitions observées correspondent principalement aux attendus de sa tranche d'âge."+strongTxt;
    case "avance1":
      return "Les réponses suggèrent que plusieurs acquisitions sont déjà présentes un peu avant l'âge habituellement observé."+(strongNames.length?(" Le profil semble donc légèrement en avance, en particulier en "+listFr(strongNames)+"."):"")+" Cette avance reste indicative et doit être interprétée avec prudence, car le développement est très variable d'un enfant à l'autre.";
    case "avance2":
      return "Les réponses suggèrent que plusieurs acquisitions sont déjà présentes nettement avant l'âge habituellement observé"+(strongNames.length?(", en particulier en "+listFr(strongNames)):"")+". Le profil semble donc nettement en avance. Cette conclusion reste indicative : les acquisitions précoces ne prédisent pas à elles seules le développement futur.";
    case "hetero":
      return "Les réponses montrent un profil hétérogène : certains domaines paraissent plus avancés"+(strongNames.length?(" ("+listFr(strongNames)+")"):"")+", tandis que d'autres semblent moins installés. Ce type de variation peut être normal, mais il mérite une observation attentive dans les prochaines semaines.";
    case "observer":
      return "Les réponses montrent que plusieurs acquisitions sont présentes, mais certains domaines semblent moins installés que ce qui est fréquemment observé à cet âge. Cela ne signifie pas automatiquement qu'il existe un problème. Ces points peuvent être observés dans les prochaines semaines ou discutés avec un professionnel si l'inquiétude persiste.";
    case "pro":
      return "Plusieurs acquisitions sont présentes, mais certaines réponses méritent un avis professionnel. L'application ne peut pas interpréter seule ces éléments. Il est recommandé d'en parler à un pédiatre, une PMI ou un professionnel de santé, qui pourront observer l'enfant dans sa globalité.";
  }
}

function buildRecommendation(cat){
  switch(cat.id){
    case "coherent":
      return "Continuez à proposer des moments d'échange, de jeu libre et d'exploration sécurisée. Le profil observé est globalement cohérent avec l'âge indiqué.";
    case "avance1":
    case "avance2":
      return "Certaines acquisitions semblent apparaître précocement. L'objectif n'est pas de pousser l'enfant plus vite, mais de lui proposer un environnement riche, sécurisé et adapté à son rythme.";
    case "hetero":
    case "observer":
      return "Certains points peuvent être observés dans les prochaines semaines. Vous pouvez proposer des activités simples et en parler à un professionnel si vous restez inquiet.";
    case "pro":
      return "Certaines réponses justifient de demander un avis professionnel. L'application ne peut pas interpréter seule ces éléments.";
  }
}

function listFr(arr){
  if(arr.length===0) return "";
  if(arr.length===1) return arr[0];
  return arr.slice(0,-1).join(", ")+" et "+arr[arr.length-1];
}

/* --- Quiz : une question à la fois, adaptatif --- */
const quiz = { di:0, mi:0, consecNo:0, phase:'milestones', fi:0 };

function startQuiz(){
  quiz.di=0; quiz.mi=0; quiz.consecNo=0; quiz.phase='milestones'; quiz.fi=0;
  renderQuiz();
}

function currentDomainMs(){
  const key = DOMAIN_ORDER[quiz.di];
  return MILESTONES.filter(m=>m.d===key).sort((a,b)=>a.age-b.age);
}

function answeredCount(){
  return Object.keys(state.answers).length;
}

function renderQuiz(){
  if(quiz.phase==='flags'){ return renderFlagQuestion(); }
  const key = DOMAIN_ORDER[quiz.di];
  const ms = currentDomainMs();
  if(quiz.mi>=ms.length){
    // domaine suivant
    quiz.di++; quiz.mi=0; quiz.consecNo=0;
    if(quiz.di>=DOMAIN_ORDER.length){ quiz.phase='flags'; quiz.fi=0; return renderQuiz(); }
    return renderQuiz();
  }
  const m = ms[quiz.mi];
  const dom = DOMAINS[key];
  const totalApprox = MILESTONES.length + FLAG_QUESTIONS.length;
  const done = answeredCount() + Object.keys(state.flags).length;
  const pct = Math.min(98, Math.round(done/totalApprox*100));
  $app.innerHTML = `
    <div class="card question">
      <div class="domain-pill">${dom.emoji} ${dom.label}</div>
      <div class="progress"><i style="width:${pct}%"></i></div>
      <div class="progress-label">${done} / ~${totalApprox} questions</div>
      <h2>Votre enfant : ${m.t} ?</h2>
      <div class="answers">
        <button class="ans yes" data-v="oui"><span class="em">😊</span> Oui, il/elle le fait</button>
        <button class="ans no" data-v="non"><span class="em">🕓</span> Pas encore</button>
        <button class="ans unknown" data-v="idk"><span class="em">🤔</span> Je ne sais pas</button>
      </div>
      <div class="quiz-foot">
        <button class="link-btn" id="back" ${(quiz.di===0&&quiz.mi===0)?'style="visibility:hidden"':''}>← Précédent</button>
        <button class="link-btn" id="quit">Recommencer</button>
      </div>
    </div>`;
  $app.querySelectorAll('.ans').forEach(b=>{
    b.onclick = ()=> answerMilestone(m, b.dataset.v);
  });
  document.getElementById('quit').onclick = showHome;
  const back = document.getElementById('back');
  if(back) back.onclick = quizBack;
  scrollTop();
}

function answerMilestone(m, v){
  state.answers[m.id]=v;
  if(v==='non') quiz.consecNo++; else if(v==='oui') quiz.consecNo=0;
  // adaptatif : 2 "pas encore" consécutifs -> on saute le reste du domaine (jalons plus difficiles)
  const ms = currentDomainMs();
  if(quiz.consecNo>=2){
    for(let i=quiz.mi+1;i<ms.length;i++){
      if(!state.answers[ms[i].id]) state.answers[ms[i].id]='non';
    }
    quiz.mi=ms.length; quiz.consecNo=0;
  } else {
    quiz.mi++;
  }
  renderQuiz();
}

function quizBack(){
  if(quiz.phase==='flags'){
    if(quiz.fi>0){ quiz.fi--; delete state.flags[FLAG_QUESTIONS[quiz.fi].id]; return renderQuiz(); }
    // retour aux jalons
    quiz.phase='milestones'; quiz.di=DOMAIN_ORDER.length-1;
    quiz.mi=currentDomainMs().length-1; quiz.consecNo=0;
    return renderQuiz();
  }
  if(quiz.mi>0){ quiz.mi--; }
  else if(quiz.di>0){ quiz.di--; quiz.mi=currentDomainMs().length-1; }
  quiz.consecNo=0;
  renderQuiz();
}

function renderFlagQuestion(){
  if(quiz.fi>=FLAG_QUESTIONS.length){ return finishQuiz(); }
  const f = FLAG_QUESTIONS[quiz.fi];
  const totalApprox = MILESTONES.length + FLAG_QUESTIONS.length;
  const done = answeredCount() + Object.keys(state.flags).length;
  const pct = Math.min(99, Math.round(done/totalApprox*100));
  $app.innerHTML = `
    <div class="card question">
      <div class="domain-pill">🛟 Quelques questions de repérage</div>
      <div class="progress"><i style="width:${pct}%"></i></div>
      <div class="progress-label">${done} / ~${totalApprox} questions</div>
      <h2>${f.t}</h2>
      <div class="answers">
        <button class="ans yes" data-v="oui"><span class="em">👍</span> Oui</button>
        <button class="ans no" data-v="non"><span class="em">👎</span> Non</button>
      </div>
      <div class="quiz-foot">
        <button class="link-btn" id="back">← Précédent</button>
        <button class="link-btn" id="quit">Recommencer</button>
      </div>
    </div>`;
  $app.querySelectorAll('.ans').forEach(b=>{
    b.onclick = ()=>{ state.flags[f.id]=b.dataset.v; quiz.fi++; renderQuiz(); };
  });
  document.getElementById('quit').onclick = showHome;
  document.getElementById('back').onclick = quizBack;
  scrollTop();
}

function finishQuiz(){
  state.estimate = runEstimation();
  if(state.mode==='blind') showResult1();
  else showBilan();
}

        </div>
      </div>
      <div class="field ${state.premature==='oui'?'':'hidden'}" id="prem-weeks-field">
        <label>Nombre de semaines de prématurité <span class="hint">(par rapport à 40 semaines)</span></label>
        <div class="inputs"><input type="number" id="premweeks" min="1" max="16" placeholder="semaines" value="${state.premWeeks||''}"> <span class="muted">semaines</span></div>
        <div class="corrected-note" id="corrnote"></div>
      </div>
      <p id="formerr" class="muted" style="color:var(--red);min-height:1em"></p>
      <button class="btn btn-primary btn-block" id="submit-age">${next==='quiz'?'Commencer le questionnaire →':'Voir le bilan personnalisé →'}</button>
    </div>`;

  const premRow = document.getElementById('prem');
  premRow.querySelectorAll('.radio-chip').forEach(c=>{
    c.onclick = ()=>{
      premRow.querySelectorAll('.radio-chip').forEach(x=>x.classList.remove('sel'));
      c.classList.add('sel'); state.premature=c.dataset.v;
      document.getElementById('prem-weeks-field').classList.toggle('hidden', state.premature!=='oui');
      updateCorrNote();
    };
  });
  const mInput=document.getElementById('months');
  const wInput=document.getElementById('premweeks');
  if(mInput) mInput.oninput=updateCorrNote;
  if(wInput) wInput.oninput=updateCorrNote;

  function updateCorrNote(){
    const note=document.getElementById('corrnote');
    const m=parseFloat(document.getElementById('months').value);
    const w=parseFloat((document.getElementById('premweeks')||{}).value);
    if(state.premature==='oui' && m>0 && w>0){
      const c=Math.max(0,Math.round((m-w/4.345)*10)/10);
      note.style.display='block';
      note.textContent=`Âge corrigé indicatif : environ ${c} mois (utilisé comme âge de référence).`;
    } else if(note){ note.style.display='none'; }
  }

  document.getElementById('submit-age').onclick = ()=>{
    const m=parseFloat(document.getElementById('months').value);
    const d=parseFloat(document.getElementById('days').value)||0;
    const err=document.getElementById('formerr');
    if(isNaN(m) || m<0){ err.textContent="Merci d'indiquer l'âge en mois."; return; }
    if(!state.premature){ err.textContent="Merci d'indiquer si l'enfant est né prématurément."; return; }
    state.realMonths = m + (d/30);
    state.realDays = d;
    if(state.premature==='oui'){
      const w=parseFloat(document.getElementById('premweeks').value);
      if(isNaN(w)||w<=0){ err.textContent="Merci d'indiquer le nombre de semaines de prématurité."; return; }
      state.premWeeks=w;
    } else { state.premWeeks=0; }
    if(next==='quiz') startQuiz();
    else showBilan();
  };
  scrollTop();
}

/* --- Phase 2 : Bilan personnalisé --- */
function showBilan(){
  const est = state.estimate;
  const cmp = buildComparison(est);
  const cat = cmp.cat;
  const conf = est.confidence;
  const confClass = conf==='élevé'?'eleve':(conf==='moyen'?'moyen':'faible');

  const strengths = buildStrengths(est, cmp);
  const watch = buildWatch(est, cmp);
  const activities = buildActivities(est, cmp);
  const conclusion = buildConclusion(est, cmp);
  const reco = buildRecommendation(cat);

  const realDisplay = formatMonths(state.realMonths) + (state.realDays?` et ${state.realDays} j`:"");
  const corrDisplay = cmp.corr!=null ? `${cmp.corr} mois` : "—";
  const indexPos = clamp((cmp.index-60)/(150-60)*100,2,98);

  // marqueur de référence sur les barres = âge de référence
  const refForBars = cmp.ref;

  window._lastBilan = {est,cmp,strengths,watch,activities,conclusion,reco}; // pour l'export

  $app.innerHTML = `
    <div class="card">
      <h2>📋 Bilan personnalisé</h2>
      <p class="section-note">Analyse indicative et non médicale, construite à partir des réponses observées.</p>

      <div class="summary-grid" style="margin-top:14px">
        <div class="stat"><div class="k">Âge réel</div><div class="v">${formatMonths(state.realMonths)} <small>mois</small></div></div>
        <div class="stat"><div class="k">Âge corrigé</div><div class="v">${cmp.corr!=null?cmp.corr:'—'} ${cmp.corr!=null?'<small>mois</small>':''}</div></div>
        <div class="stat"><div class="k">Âge développemental estimé</div><div class="v">${est.rangeLow}–${est.rangeHigh} <small>mois</small></div></div>
        <div class="stat"><div class="k">Indice de cohérence</div><div class="v">${cmp.index} <small>%</small></div></div>
      </div>

      <div class="index-meter">
        <div class="marker"><span style="left:${indexPos}%">${cmp.index}%</span></div>
        <div class="bartrack"></div>
        <p class="section-note" style="margin-top:8px">Lecture : <strong>${indexReading(cmp.index)}</strong>. Niveau de confiance : <span class="conf ${confClass}" style="padding:2px 10px;font-size:.78rem">${conf}</span></p>
      </div>

      <div class="center" style="margin-top:18px">
        <span class="badge ${cat.badge}">${cat.emoji} ${cat.label}</span>
      </div>
    </div>

    <div class="card">
      <h2>Conclusion</h2>
      <p class="conclusion">${conclusion}</p>
      <div class="prudence">${cat.msg}</div>
    </div>

    <div class="card">
      <h2>📊 Profil par domaine</h2>
      <p class="section-note">La ligne rouge indique l'âge de référence ${cmp.corr!=null?'(âge corrigé)':'(âge réel)'} : ${Math.round(refForBars*10)/10} mois.</p>
      ${domainBars(est, refForBars)}
    </div>

    <div class="card">
      <h2>⭐ Forces observées</h2>
      ${strengths.length?`<ul class="clean strong">${strengths.map(s=>`<li>${s}</li>`).join('')}</ul>`:'<p class="muted">Les réponses ne mettent pas en évidence de domaine nettement au-dessus des autres pour le moment — ce qui est tout à fait normal.</p>'}
    </div>

    ${watch.length?`<div class="card">
      <h2>👀 Points à observer ou à accompagner</h2>
      <p class="section-note">Ces éléments sont à <strong>observer</strong> et à <strong>accompagner</strong> en douceur — ce ne sont pas des défauts.</p>
      <ul class="clean watch">${watch.map(w=>`<li>${w}</li>`).join('')}</ul>
    </div>`:''}

    <div class="card">
      <h2>🎯 Activités conseillées</h2>
      <ul class="clean activity">${activities.map(a=>`<li>${a}</li>`).join('')}</ul>
    </div>

    <div class="card">
      <div class="when-box ${cmp.allAlerts.length?'flagged':''}">
        <h2 style="margin-bottom:.4rem">🩺 Quand demander un avis</h2>
        ${cmp.allAlerts.length
          ? `<p>Les éléments suivants méritent d'en parler à un professionnel de santé :</p><ul class="clean alert">${cmp.allAlerts.map(a=>`<li>${a}</li>`).join('')}</ul>`
          : `<p class="muted">Aucun signal particulier n'a été repéré dans vos réponses.</p>`}
        <p class="section-note" style="margin-top:10px">Il est recommandé de consulter en cas de : perte d'une compétence déjà acquise, absence de réaction aux sons, absence importante d'interaction, asymétrie corporelle marquée, absence de babillage vers 9-10 mois, ou absence de réaction au prénom vers 10-12 mois.</p>
      </div>
      <div class="prudence" style="margin-top:14px"><strong>Recommandation :</strong> ${reco}</div>
    </div>

    <div class="card no-print">
      <div class="btn-row">
        <button class="btn btn-primary" id="export">⬇️ Exporter le bilan</button>
        <button class="btn btn-ghost" id="print">🖨️ Imprimer / PDF</button>
        <button class="btn btn-ghost" id="restart">🔄 Recommencer l'évaluation</button>
      </div>
      <p class="section-note center" style="margin-top:14px">Rappel : ce bilan est indicatif et ne remplace pas l'avis d'un professionnel de santé.</p>
    </div>`;

  document.getElementById('export').onclick = exportBilan;
  document.getElementById('print').onclick = ()=>window.print();
  document.getElementById('restart').onclick = showHome;
  scrollTop();
}

function formatMonths(m){
  if(m==null) return '—';
  return (Math.round(m*10)/10).toString().replace('.0','');
}

/* --- Export texte --- */
function exportBilan(){
  const b = window._lastBilan; if(!b) return;
  const {est,cmp,strengths,watch,activities,conclusion,reco}=b;
  const L=[];
  L.push("BILAN DÉVELOPPEMENTAL INDICATIF (non médical)");
  L.push("Généré le "+new Date().toLocaleDateString('fr-FR'));
  L.push("=".repeat(48));
  L.push("");
  L.push("RÉSUMÉ");
  L.push("- Âge réel : "+formatMonths(state.realMonths)+" mois"+(state.realDays?(" et "+state.realDays+" jours"):""));
  if(cmp.corr!=null) L.push("- Âge corrigé (prématurité) : "+cmp.corr+" mois");
  L.push("- Âge développemental estimé : "+est.rangeLow+" à "+est.rangeHigh+" mois (estimation ~"+est.roundedOverall+")");
  L.push("- Indice de cohérence : "+cmp.index+"% — "+indexReading(cmp.index));
  L.push("- Niveau de confiance : "+est.confidence);
  L.push("- Classification : "+cmp.cat.label);
  L.push("");
  L.push("PROFIL PAR DOMAINE (âge développemental estimé)");
  DOMAIN_ORDER.forEach(k=>L.push("- "+DOMAINS[k].label+" : ~"+(Math.round(est.domains[k].est*2)/2)+" mois"));
  L.push("");
  L.push("CONCLUSION");
  L.push(conclusion);
  L.push("");
  L.push("FORCES OBSERVÉES");
  (strengths.length?strengths:["—"]).forEach(s=>L.push("- "+s));
  L.push("");
  L.push("POINTS À OBSERVER / ACCOMPAGNER");
  (watch.length?watch:["—"]).forEach(w=>L.push("- "+w));
  L.push("");
  L.push("ACTIVITÉS CONSEILLÉES");
  activities.forEach(a=>L.push("- "+a));
  L.push("");
  if(cmp.allAlerts.length){
    L.push("À DISCUTER AVEC UN PROFESSIONNEL");
    cmp.allAlerts.forEach(a=>L.push("- "+a));
    L.push("");
  }
  L.push("RECOMMANDATION");
  L.push(reco);
  L.push("");
  L.push("-".repeat(48));
  L.push("Cet outil est indicatif et non médical. Il ne pose aucun diagnostic.");
  L.push("En cas de doute, parlez-en à un pédiatre, un médecin ou une PMI.");

  const blob=new Blob([L.join("\n")],{type:"text/plain;charset=utf-8"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url; a.download="bilan-developpemental.txt"; a.click();
  URL.revokeObjectURL(url);
}

/* ============================================================
   DÉMARRAGE
============================================================ */
showHome();
</script>
</body>
