<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Carnet d'éveil — Bilan développemental indicatif (3–12 mois)</title>
<meta name="description" content="Carnet de suivi du développement de bébé (3 à 12 mois) : estimation à l'aveugle, comparaison avec l'âge réel, historique et courbes d'évolution. Outil indicatif, non médical.">
<meta name="theme-color" content="#f2f5fc" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e1320" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f2f5fc; --bg2:#e7eefb; --card:#ffffff; --ink:#222b42; --muted:#69748f;
    --primary:#5b7cfa; --primary-2:#7c5bfa; --primary-d:#3d5ce0; --on-primary:#fff;
    --accent:#37c391; --warm:#f6a851; --soft:#eef2fc; --line:#e9edf7;
    --green:#37b57e; --amber:#e9a83a; --red:#e26d60; --violet:#9b8ad6;
    --chart-grid:#e9edf7; --chart-text:#9aa6bd;
    --r-lg:24px; --r-md:16px; --r-sm:12px;
    --shadow:0 18px 40px -18px rgba(34,43,66,.18), 0 2px 8px rgba(34,43,66,.04);
    --shadow-sm:0 6px 18px -8px rgba(34,43,66,.16);
    --glass:rgba(255,255,255,.72);
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#0e1320; --bg2:#121a2c; --card:#1a2235; --ink:#e9edf8; --muted:#94a0bb;
      --primary:#6e8cff; --primary-2:#8f6eff; --primary-d:#a5b8ff; --on-primary:#0e1320;
      --soft:#222c45; --line:#27314c;
      --chart-grid:#27314c; --chart-text:#7c89a8;
      --shadow:0 18px 40px -18px rgba(0,0,0,.5), 0 2px 8px rgba(0,0,0,.25);
      --shadow-sm:0 6px 18px -8px rgba(0,0,0,.45);
      --glass:rgba(20,27,44,.72);
    }
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{
    font-family:'Plus Jakarta Sans','Segoe UI',system-ui,-apple-system,sans-serif;
    color:var(--ink); line-height:1.55; -webkit-font-smoothing:antialiased;
    background:
      radial-gradient(900px 420px at 85% -160px, color-mix(in srgb, var(--primary) 16%, transparent), transparent 70%),
      radial-gradient(700px 380px at -10% -120px, color-mix(in srgb, var(--accent) 14%, transparent), transparent 70%),
      linear-gradient(180deg,var(--bg2) 0%,var(--bg) 360px);
    min-height:100vh;
  }
  .wrap{max-width:920px;margin:0 auto;padding:0 18px 90px}
  /* ---- Top bar (glass) ---- */
  .topbar{
    position:sticky;top:0;z-index:50;display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:12px 16px;margin:0 -18px 6px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    background:var(--glass);border-bottom:1px solid var(--line);
  }
  .brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:1.02rem;cursor:pointer;background:none;border:none;color:var(--ink);font-family:inherit}
  .brand .logo{font-size:1.5rem;filter:drop-shadow(0 3px 6px rgba(91,124,250,.35))}
  .account{display:flex;align-items:center;gap:8px;font-size:.82rem}
  .account .who{color:var(--muted);font-weight:600}
  /* ---- Hero ---- */
  header.hero{text-align:center;padding:30px 10px 8px}
  header.hero h1{font-size:clamp(1.5rem,4.6vw,2.1rem);font-weight:800;letter-spacing:-.02em;
    background:linear-gradient(95deg,var(--ink) 30%,var(--primary) 75%,var(--primary-2));
    -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
  header.hero p.sub{color:var(--muted);font-size:.97rem;max-width:540px;margin:10px auto 0}
  .steps{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:560px;margin:22px auto 4px}
  .step{background:var(--card);border:1px solid var(--line);border-radius:var(--r-md);padding:12px 10px;text-align:center;box-shadow:var(--shadow-sm)}
  .step .ic{font-size:1.4rem}
  .step .t{font-size:.78rem;font-weight:700;margin-top:4px}
  .step .s{font-size:.7rem;color:var(--muted);margin-top:2px}
  /* ---- Cards & screens ---- */
  .screen{animation:rise .38s cubic-bezier(.22,.9,.3,1) both}
  @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow);padding:26px;margin:16px 0}
  .card.tight{padding:20px}
  .card h2{font-size:1.22rem;font-weight:800;letter-spacing:-.01em;margin-bottom:.4rem}
  .card h3{font-size:1.02rem;font-weight:700;margin:1.1rem 0 .5rem}
  .muted{color:var(--muted)} .center{text-align:center} .small{font-size:.85rem}
  .row{display:flex;gap:12px;flex-wrap:wrap} .grow{flex:1;min-width:200px}
  /* ---- Buttons ---- */
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:.5rem;border:none;border-radius:14px;
    padding:14px 22px;font-size:.98rem;font-weight:700;cursor:pointer;font-family:inherit;text-decoration:none;
    transition:transform .12s ease, box-shadow .2s ease, background .2s ease, filter .2s;
  }
  .btn:active{transform:scale(.97)}
  .btn:focus-visible{outline:3px solid color-mix(in srgb,var(--primary) 40%,transparent);outline-offset:2px}
  .btn-primary{background:linear-gradient(115deg,var(--primary),var(--primary-2));color:#fff;
    box-shadow:0 10px 24px -8px color-mix(in srgb,var(--primary) 65%,transparent)}
  .btn-primary:hover{filter:brightness(1.06)}
  .btn-ghost{background:var(--soft);color:var(--primary-d)} .btn-ghost:hover{filter:brightness(1.03)}
  .btn-soft{background:var(--card);border:1.5px solid var(--line);color:var(--ink)} .btn-soft:hover{border-color:var(--primary)}
  .btn-danger{background:transparent;border:1.5px solid color-mix(in srgb,var(--red) 35%,transparent);color:var(--red)}
  .btn-danger:hover{background:color-mix(in srgb,var(--red) 10%,transparent)}
  .btn-block{width:100%} .btn-sm{padding:8px 14px;font-size:.84rem;border-radius:11px}
  .btn-row{display:flex;gap:12px;flex-wrap:wrap;margin-top:16px}
  .btn-row .btn{flex:1;min-width:150px}
  .link-btn{background:none;border:none;color:var(--muted);cursor:pointer;font-size:.9rem;text-decoration:underline;font-family:inherit}
  .link-btn:focus-visible{outline:3px solid color-mix(in srgb,var(--primary) 40%,transparent);border-radius:6px}
  /* ---- Choice cards ---- */
  .choice{border:1.5px solid var(--line);border-radius:18px;padding:20px;cursor:pointer;width:100%;text-align:left;
    background:var(--card);transition:border-color .2s,box-shadow .2s,transform .14s;margin-top:12px;font-family:inherit;color:inherit}
  .choice:hover{border-color:var(--primary);box-shadow:var(--shadow-sm);transform:translateY(-2px)}
  .choice:focus-visible{outline:3px solid color-mix(in srgb,var(--primary) 40%,transparent);outline-offset:2px}
  .choice .tag{display:inline-block;font-size:.68rem;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:#fff;
    background:linear-gradient(100deg,var(--accent),#2da57b);border-radius:20px;padding:4px 11px;margin-bottom:10px}
  .choice h3{margin:0 0 .25rem;font-size:1.06rem} .choice p{color:var(--muted);font-size:.9rem}
  /* ---- Child cards ---- */
  .child-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px;margin-top:14px}
  .child-card{background:var(--card);border:1.5px solid var(--line);border-radius:20px;padding:18px;cursor:pointer;text-align:left;
    transition:border-color .2s,transform .14s,box-shadow .2s;font-family:inherit;color:inherit;position:relative;overflow:hidden}
  .child-card::before{content:'';position:absolute;inset:0 0 auto;height:64px;
    background:linear-gradient(115deg,color-mix(in srgb,var(--primary) 14%,transparent),color-mix(in srgb,var(--accent) 12%,transparent));}
  .child-card:hover{border-color:var(--primary);transform:translateY(-3px);box-shadow:var(--shadow-sm)}
  .child-card:focus-visible{outline:3px solid color-mix(in srgb,var(--primary) 40%,transparent);outline-offset:2px}
  .avatar-circle{position:relative;width:56px;height:56px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    font-size:1.7rem;background:linear-gradient(135deg,var(--soft),var(--card));border:2px solid var(--card);
    box-shadow:var(--shadow-sm)}
  .child-card .nm{font-weight:800;font-size:1.12rem;margin-top:10px}
  .child-card .meta{color:var(--muted);font-size:.8rem;margin-top:2px}
  .child-card.add{display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--primary-d);
    border-style:dashed;min-height:140px;font-weight:700;background:transparent}
  .child-card.add::before{display:none}
  /* ---- Quiz ---- */
  .progress{height:9px;background:var(--soft);border-radius:20px;overflow:hidden;margin:8px 0 4px}
  .progress > i{display:block;height:100%;width:0;border-radius:20px;transition:width .4s cubic-bezier(.22,.9,.3,1);
    background:linear-gradient(90deg,var(--primary),var(--primary-2),var(--accent));background-size:200% 100%;animation:shimmer 2.4s linear infinite}
  @keyframes shimmer{to{background-position:-200% 0}}
  .progress-label{font-size:.78rem;color:var(--muted);text-align:right;margin-bottom:6px}
  .dots{display:flex;gap:8px;justify-content:center;margin:4px 0 16px}
  .dots .dot{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1rem;
    background:var(--soft);opacity:.45;transition:all .25s}
  .dots .dot.done{opacity:.9}
  .dots .dot.now{opacity:1;background:linear-gradient(135deg,color-mix(in srgb,var(--primary) 22%,var(--soft)),var(--soft));
    box-shadow:0 0 0 3px color-mix(in srgb,var(--primary) 25%,transparent);transform:scale(1.08)}
  .domain-pill{display:inline-flex;align-items:center;gap:6px;font-size:.78rem;font-weight:700;color:var(--primary-d);
    background:var(--soft);border-radius:20px;padding:5px 13px;margin-bottom:10px}
  .question h2{font-size:1.32rem;line-height:1.42;margin:8px 0 20px;letter-spacing:-.01em}
  .answers{display:flex;flex-direction:column;gap:12px}
  .ans{border:1.5px solid var(--line);background:var(--card);border-radius:16px;padding:16px 18px;font-size:1rem;font-weight:700;
    cursor:pointer;text-align:left;transition:all .14s;display:flex;align-items:center;gap:14px;font-family:inherit;color:inherit}
  .ans .em{width:42px;height:42px;border-radius:13px;display:flex;align-items:center;justify-content:center;font-size:1.3rem;background:var(--soft);flex:0 0 42px}
  .ans:focus-visible{outline:3px solid color-mix(in srgb,var(--primary) 40%,transparent);outline-offset:2px}
  .ans.yes:hover{border-color:var(--green);background:color-mix(in srgb,var(--green) 7%,var(--card))}
  .ans.no:hover{border-color:var(--warm);background:color-mix(in srgb,var(--warm) 8%,var(--card))}
  .ans.unknown:hover{border-color:var(--violet);background:color-mix(in srgb,var(--violet) 8%,var(--card))}
  .ans.picked{border-color:var(--primary);background:color-mix(in srgb,var(--primary) 10%,var(--card));transform:scale(.985)}
  .answers.locked .ans{pointer-events:none}
  .quiz-foot{display:flex;justify-content:space-between;align-items:center;margin-top:20px}
  /* ---- Recap ---- */
  .recap-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px;margin-top:10px}
  .recap-cell{background:var(--soft);border-radius:14px;padding:12px;text-align:center}
  .recap-cell .e{font-size:1.2rem} .recap-cell .n{font-weight:800;font-size:1.05rem;margin-top:2px}
  .recap-cell .l{font-size:.66rem;color:var(--muted);font-weight:600}
  .fix-item{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:12px 14px;margin-top:8px;
    border:1.5px dashed color-mix(in srgb,var(--violet) 45%,transparent);border-radius:14px;background:color-mix(in srgb,var(--violet) 6%,var(--card));
    cursor:pointer;font-family:inherit;color:inherit;font-size:.92rem;font-weight:600;transition:border-color .15s}
  .fix-item:hover{border-color:var(--violet)} .fix-item:focus-visible{outline:3px solid color-mix(in srgb,var(--violet) 40%,transparent)}
  .fix-item .go{margin-left:auto;color:var(--violet);font-weight:800;white-space:nowrap;font-size:.8rem}
  /* ---- Result hero ---- */
  .age-hero{text-align:center;padding:10px 0 4px}
  .age-hero .big{font-size:3.4rem;font-weight:800;letter-spacing:-.03em;line-height:1;
    background:linear-gradient(110deg,var(--primary),var(--primary-2));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
  .age-hero .big small{font-size:1.1rem;-webkit-text-fill-color:var(--muted);font-weight:700}
  .age-hero .range{color:var(--muted);margin-top:8px}
  .conf{display:inline-flex;align-items:center;gap:8px;margin-top:14px;font-weight:700;font-size:.85rem;padding:7px 15px;border-radius:20px}
  .conf.eleve{background:color-mix(in srgb,var(--green) 14%,transparent);color:var(--green)}
  .conf.moyen{background:color-mix(in srgb,var(--amber) 16%,transparent);color:#b07f17}
  .conf.faible{background:color-mix(in srgb,var(--red) 14%,transparent);color:var(--red)}
  /* ---- Domain bars ---- */
  .bars{margin-top:8px}
  .bar-row{margin:15px 0}
  .bar-row .lab{display:flex;justify-content:space-between;font-size:.9rem;margin-bottom:6px;font-weight:600}
  .bar-row .lab .age{font-weight:800;color:var(--primary-d)}
  .track{position:relative;height:14px;background:var(--soft);border-radius:20px}
  .track > i{display:block;height:100%;width:0;border-radius:20px;background:linear-gradient(90deg,var(--primary),var(--accent));
    transition:width .8s cubic-bezier(.22,.9,.3,1)}
  .track .refline{position:absolute;top:-5px;bottom:-5px;width:3px;background:var(--red);border-radius:3px}
  .track .refline::after{content:'âge réel';position:absolute;top:-17px;left:50%;transform:translateX(-50%);
    font-size:.6rem;color:var(--red);white-space:nowrap;font-weight:800}
  .scale{display:flex;justify-content:space-between;font-size:.66rem;color:var(--muted);margin-top:3px}
  /* ---- Lists ---- */
  ul.clean{list-style:none;margin:6px 0}
  ul.clean li{padding:9px 0 9px 30px;position:relative;border-bottom:1px solid var(--line);font-size:.94rem}
  ul.clean li:last-child{border-bottom:none}
  ul.clean li::before{position:absolute;left:0;top:9px}
  ul.yes li::before{content:'✅'} ul.no li::before{content:'•';color:var(--warm);font-size:1.5rem;top:1px}
  ul.unk li::before{content:'❔'} ul.activity li::before{content:'🎯'} ul.strong li::before{content:'⭐'}
  ul.watch li::before{content:'👀'} ul.alert li::before{content:'⚑';color:var(--red)}
  .prudence{background:var(--soft);border-left:4px solid var(--primary);border-radius:12px;padding:13px 16px;font-size:.9rem;margin-top:16px}
  details.tech{margin-top:14px;background:color-mix(in srgb,var(--soft) 50%,var(--card));border:1px solid var(--line);border-radius:14px;padding:6px 14px}
  details.tech summary{cursor:pointer;font-weight:700;font-size:.88rem;color:var(--muted);padding:8px 0}
  /* ---- Form ---- */
  .field{margin:16px 0}.field label{display:block;font-weight:700;margin-bottom:7px}
  .field .hint{font-weight:500;color:var(--muted);font-size:.83rem}
  .inputs{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
  input[type=number],input[type=text],input[type=date]{
    padding:13px 14px;border:1.5px solid var(--line);border-radius:13px;font-size:1rem;font-family:inherit;
    background:var(--card);color:var(--ink);transition:border-color .15s}
  input[type=number]{width:108px} input[type=text]{width:100%;max-width:340px} input[type=date]{min-width:170px}
  input:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px color-mix(in srgb,var(--primary) 18%,transparent)}
  .radio-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
  .radio-chip{border:1.5px solid var(--line);border-radius:13px;padding:11px 17px;cursor:pointer;font-weight:700;
    transition:all .14s;background:var(--card);font-family:inherit;color:inherit}
  .radio-chip:hover{border-color:var(--primary)}
  .radio-chip:focus-visible{outline:3px solid color-mix(in srgb,var(--primary) 40%,transparent);outline-offset:2px}
  .radio-chip.sel{border-color:var(--primary);background:color-mix(in srgb,var(--primary) 11%,var(--card));color:var(--primary-d)}
  .corrected-note{background:color-mix(in srgb,var(--green) 11%,transparent);border-radius:12px;padding:10px 14px;color:var(--green);font-size:.88rem;margin-top:10px;display:none;font-weight:600}
  .or-divider{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:.78rem;font-weight:700;margin:14px 0 4px}
  .or-divider::before,.or-divider::after{content:'';flex:1;height:1px;background:var(--line)}
  /* ---- Avatar picker ---- */
  .avatar-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:8px;margin-top:8px}
  .avatar-opt{font-size:1.5rem;padding:9px 0;border:1.5px solid var(--line);border-radius:13px;background:var(--card);cursor:pointer;transition:all .14s}
  .avatar-opt:hover{border-color:var(--primary);transform:scale(1.06)}
  .avatar-opt.sel{border-color:var(--primary);background:color-mix(in srgb,var(--primary) 12%,var(--card));box-shadow:var(--shadow-sm)}
  .avatar-opt:focus-visible{outline:3px solid color-mix(in srgb,var(--primary) 40%,transparent)}
  /* ---- Summary / badge ---- */
  .summary-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-top:14px}
  .stat{background:var(--soft);border-radius:16px;padding:14px;text-align:center}
  .stat .k{font-size:.72rem;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.04em}
  .stat .v{font-size:1.45rem;font-weight:800;color:var(--primary-d);margin-top:3px}
  .stat .v small{font-size:.76rem;color:var(--muted);font-weight:700}
  .badge{display:inline-flex;align-items:center;gap:8px;font-weight:800;padding:11px 20px;border-radius:30px;font-size:1rem;margin-top:8px;
    animation:pop .5s cubic-bezier(.2,1.4,.4,1) both}
  @keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
  .badge.coherent{background:color-mix(in srgb,var(--green) 15%,transparent);color:var(--green)}
  .badge.avance1{background:color-mix(in srgb,var(--primary) 14%,transparent);color:var(--primary-d)}
  .badge.avance2{background:color-mix(in srgb,var(--violet) 18%,transparent);color:var(--violet)}
  .badge.hetero{background:color-mix(in srgb,var(--warm) 18%,transparent);color:#b9761f}
  .badge.observer{background:color-mix(in srgb,var(--amber) 18%,transparent);color:#b07f17}
  .badge.pro{background:color-mix(in srgb,var(--red) 14%,transparent);color:var(--red)}
  .mini-badge{font-size:.7rem;font-weight:800;padding:4px 10px;border-radius:20px;white-space:nowrap;animation:none;margin:0}
  .conclusion{font-size:1.02rem;line-height:1.75}
  .section-note{font-size:.84rem;color:var(--muted)}
  .when-box{background:color-mix(in srgb,var(--red) 4%,var(--card));border:1px solid color-mix(in srgb,var(--red) 18%,transparent);border-radius:16px;padding:16px}
  .when-box.flagged{background:color-mix(in srgb,var(--red) 9%,var(--card));border-color:color-mix(in srgb,var(--red) 35%,transparent)}
  /* ---- History ---- */
  .hist-item{display:flex;align-items:center;gap:12px;padding:13px 14px;border:1.5px solid var(--line);border-radius:15px;margin-top:10px;
    cursor:pointer;background:var(--card);width:100%;text-align:left;font-family:inherit;color:inherit;transition:border-color .15s,transform .12s}
  .hist-item:hover{border-color:var(--primary);transform:translateX(2px)}
  .hist-item:focus-visible{outline:3px solid color-mix(in srgb,var(--primary) 40%,transparent)}
  .hist-item .d{font-weight:700;min-width:90px;font-size:.86rem} .hist-item .a{color:var(--primary-d);font-weight:800}
  .hist-item .b{margin-left:auto}
  .resume-card{border:1.5px dashed color-mix(in srgb,var(--primary) 50%,transparent);border-radius:18px;padding:16px;
    background:color-mix(in srgb,var(--primary) 6%,var(--card));margin-top:14px}
  /* ---- Charts ---- */
  .chart-wrap{overflow-x:auto}
  svg.chart{display:block;width:100%;height:auto;min-width:320px}
  .legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px;font-size:.8rem;color:var(--muted);font-weight:600}
  .legend span{display:inline-flex;align-items:center;gap:6px}
  .legend i{width:16px;height:5px;border-radius:3px;display:inline-block}
  .pill-note{display:inline-block;background:color-mix(in srgb,var(--green) 13%,transparent);color:var(--green);border-radius:20px;padding:5px 13px;font-size:.78rem;font-weight:700;margin:4px 6px 0 0}

const STORE_KEY = "bdb_store_v2";
const SESSION_KEY = "bdb_session_v1";
let store = { children:[], activeChildId:null, version:2 };

function loadStore(){
  try{ const raw=localStorage.getItem(STORE_KEY); if(raw){ store=JSON.parse(raw); store.children=store.children||[]; } }
  catch(e){ console.warn("store load",e); }
}

  try{ localStorage.setItem(STORE_KEY, JSON.stringify(store)); }catch(e){ console.warn("store save",e); }

}
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function getChild(id){ return store.children.find(c=>c.id===id)||null; }
function addChild(name, avatar){
  const c={ id:uid(), name:(name||"").trim()||"Mon bébé", avatar:avatar||AVATARS[store.children.length%AVATARS.length],
    birthdate:null, premature:null, premWeeks:0,
    createdAt:new Date().toISOString(), records:[] };
  store.children.push(c); store.activeChildId=c.id; saveStore(); return c;
}
function deleteChild(id){
  store.children=store.children.filter(c=>c.id!==id);
  if(store.activeChildId===id) store.activeChildId=null;
  const s=loadSession(); if(s && s.childId===id) clearSession();
  saveStore();
}
function addRecord(childId, record){
  const c=getChild(childId); if(!c) return;
  record.id=uid(); c.records.push(record); c.records.sort((a,b)=>new Date(a.date)-new Date(b.date));
  saveStore();
}
function deleteRecord(childId, recId){

}

/* ============================================================
   3. CLOUD — Firebase optionnel (login Google + synchro)
============================================================ */
const Cloud = (function(){
  let enabled=false, user=null, db=null, auth=null, fns=null, syncTimer=null, ready=false;
  async function init(){
    if(!FIREBASE_CONFIG){ ready=true; renderAccount(); return; }
    try{
      const appMod  = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js");
      const authMod = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js");
      const fsMod   = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js");
      const app = appMod.initializeApp(FIREBASE_CONFIG);
      auth = authMod.getAuth(app); db = fsMod.getFirestore(app);
      fns = { ...authMod, ...fsMod };
      enabled=true; ready=true;
      authMod.onAuthStateChanged(auth, async (u)=>{ user=u; if(u){ await pull(); } renderAccount(); route(currentRoute.name,currentRoute.params); });
    }catch(e){ console.warn("Firebase indisponible, mode local",e); enabled=false; ready=true; renderAccount(); }
  }
  async function signIn(){
    if(!enabled) return;
    try{ const provider=new fns.GoogleAuthProvider(); await fns.signInWithPopup(auth, provider); }
    catch(e){ alert("Connexion impossible : "+(e&&e.message||e)); }
  }
  async function signOut(){ if(enabled){ try{ await fns.signOut(auth); }catch(e){} } user=null; renderAccount(); }
  async function pull(){
    if(!enabled||!user) return;
    try{
      const ref=fns.doc(db,"users",user.uid);
      const snap=await fns.getDoc(ref);
      if(snap.exists()){ const cloud=snap.data().store; if(cloud) mergeInto(cloud); }
      else { await push(); }
    }catch(e){ console.warn("pull",e); }
  }
  function mergeInto(cloud){
    const byId={}; (store.children||[]).forEach(c=>byId[c.id]=c);
    (cloud.children||[]).forEach(cc=>{
      if(!byId[cc.id]){ byId[cc.id]=cc; }
      else{
        const local=byId[cc.id]; const recIds=new Set(local.records.map(r=>r.id));
        cc.records.forEach(r=>{ if(!recIds.has(r.id)) local.records.push(r); });
        local.records.sort((a,b)=>new Date(a.date)-new Date(b.date));
      }
    });
    store.children=Object.values(byId);
    try{ localStorage.setItem(STORE_KEY, JSON.stringify(store)); }catch(e){}
  }
  async function push(){
    if(!enabled||!user) return;
    try{ const ref=fns.doc(db,"users",user.uid); await fns.setDoc(ref,{store,updatedAt:new Date().toISOString()}); }
    catch(e){ console.warn("push",e); }
  }
  function scheduleSync(){ if(!enabled||!user) return; clearTimeout(syncTimer); syncTimer=setTimeout(push,1200); }
  return { init, signIn, signOut, scheduleSync,
    get enabled(){return enabled;}, get user(){return user;}, get ready(){return ready;},
    get configured(){return !!FIREBASE_CONFIG;} };
})();

function renderAccount(){

/* ============================================================
   4. MOTEUR — estimation, comparaison, classification, synthèse
============================================================ */
function clamp(v,min,max){return Math.max(min,Math.min(max,v));}

function estimateDomainFrom(answers, domainKey){
  const ms=MILESTONES.filter(m=>m.d===domainKey).sort((a,b)=>a.age-b.age);
  const acquired=[],notyet=[],unknown=[];
  ms.forEach(m=>{ const a=answers[m.id]||'unanswered';
    if(a==='oui')acquired.push(m.age); else if(a==='non')notyet.push(m.age); else unknown.push(m.age); });
  const minAge=ms[0].age,maxAge=ms[ms.length-1].age;
  const ceiling=notyet.length?Math.min(...notyet):(maxAge+1);
  const below=acquired.filter(a=>a<ceiling);
  const floor=below.length?Math.max(...below):(minAge-1);
  const advanced=acquired.filter(a=>a>=ceiling).length;
  let est=(floor+ceiling)/2 + advanced*0.3;
  est=clamp(est,3,12);
  return { domain:domainKey, est, floor, ceiling, acquired, notyet, unknown,
    passRate:acquired.length/ms.length, nUnknown:unknown.length, total:ms.length };
}

function runEstimation(answers, flags){
  const domains={}; DOMAIN_ORDER.forEach(k=>domains[k]=estimateDomainFrom(answers,k));
  const ests=DOMAIN_ORDER.map(k=>domains[k].est);
  const overall=ests.reduce((a,b)=>a+b,0)/ests.length;
  const minD=Math.min(...ests),maxD=Math.max(...ests),spread=maxD-minD;
  const totalQ=MILESTONES.length;
  const nUnknown=DOMAIN_ORDER.reduce((s,k)=>s+domains[k].nUnknown,0);
  const unknownRatio=nUnknown/totalQ;
  let confidence='élevé';
  if(unknownRatio>0.25||spread>=4)confidence='moyen';
  if(unknownRatio>0.5||spread>=6)confidence='faible';
  const pad=confidence==='faible'?1.5:(confidence==='moyen'?1:0.5);
  const rangeLow=clamp(Math.round(Math.min(overall-pad,minD)),3,12);
  const rangeHigh=clamp(Math.round(Math.max(overall+pad,maxD)),3,12);
  const present=[],absent=[],uncertain=[];
  MILESTONES.forEach(m=>{ const a=answers[m.id]||'unanswered';
    if(a==='oui')present.push(m); else if(a==='non')absent.push(m); else if(a==='idk')uncertain.push(m); });
  const alerts=[]; FLAG_QUESTIONS.forEach(f=>{ if(flags[f.id]===f.alertIf)alerts.push(f.text); });
  return { domains, overall, roundedOverall:Math.round(overall*2)/2, minD, maxD, spread,
    confidence, unknownRatio, rangeLow, rangeHigh, present, absent, uncertain, alerts };
}

const CATS={
  coherent:{id:"coherent",label:"Cohérent avec l'âge",badge:"coherent",emoji:"✅",msg:"Les acquisitions observées sont globalement cohérentes avec l'âge indiqué."},
  avance1:{id:"avance1",label:"Légèrement en avance",badge:"avance1",emoji:"🌱",msg:"Plusieurs acquisitions semblent apparaître un peu plus tôt que la moyenne. Cela peut traduire une avance dans certains domaines, tout en restant dans la variabilité normale du développement."},
  avance2:{id:"avance2",label:"Nettement en avance",badge:"avance2",emoji:"🚀",msg:"Les réponses suggèrent un profil nettement avancé sur plusieurs domaines. Cette conclusion reste indicative, car les acquisitions précoces ne prédisent pas à elles seules le développement futur."},
  hetero:{id:"hetero",label:"Profil hétérogène",badge:"hetero",emoji:"🧩",msg:"Le profil semble hétérogène : certains domaines paraissent plus avancés, tandis que d'autres sont moins installés. Ce type de variation peut être normal, mais il mérite une observation attentive."},
  observer:{id:"observer",label:"Points à observer",badge:"observer",emoji:"👀",msg:"Certains éléments semblent moins installés que ce qui est fréquemment observé à cet âge. Il peut être utile de les observer dans les prochaines semaines et d'en parler à un professionnel si cela persiste."},
  pro:{id:"pro",label:"Avis professionnel recommandé",badge:"pro",emoji:"🩺",msg:"Certaines réponses méritent un avis professionnel. L'application ne peut pas interpréter seule ces éléments. Il est recommandé d'en parler à un pédiatre, une PMI ou un professionnel de santé."}
};

function buildComparison(est, answers, ref, corr){
  const index=Math.round(est.overall/ref*100);
  const diff=est.overall-ref;
  const ageDep=[];
  if(ref>=9 && (answers.l9||'')==='non' && (answers.l7||'')==='non') ageDep.push("Absence de babillage varié vers 9-10 mois");
  if(ref>=10 && (answers.l10||'')==='non') ageDep.push("Absence de réaction au prénom vers 10-12 mois");
  if(ref>=5 && (answers.g3||'')==='non') ageDep.push("Tenue de tête non acquise au-delà de l'âge attendu");
  const allAlerts=est.alerts.concat(ageDep);
  const farBelow=DOMAIN_ORDER.filter(k=>est.domains[k].est<=ref-3);
  const above=DOMAIN_ORDER.filter(k=>est.domains[k].est>=ref+1);
  let cat;
  if(allAlerts.length>0||farBelow.length>=2) cat=CATS.pro;
  else if(est.spread>=3 && above.length>=1 && farBelow.length>=1) cat=CATS.hetero;
  else if(est.spread>=3 && (est.maxD-est.minD)>=3 && DOMAIN_ORDER.some(k=>est.domains[k].est>=ref+0.5) && DOMAIN_ORDER.some(k=>est.domains[k].est<=ref-2)) cat=CATS.hetero;
  else if(diff>=2 && diff<=3.5 && above.length>=3 && est.confidence==='élevé') cat=CATS.avance2;
  else if(index>140) cat=CATS.avance2;
  else if(diff>=1) cat=CATS.avance1;
  else if(index<90) cat=CATS.observer;
  else cat=CATS.coherent;
  return { ref, corr, index, diff, allAlerts, above, farBelow, cat };
}

function indexReading(i){
  if(i>140)return"profil très avancé, à interpréter avec prudence";
  if(i>=126)return"profil nettement en avance sur plusieurs acquisitions";
  if(i>=111)return"profil légèrement en avance";
  if(i>=90)return"profil globalement cohérent avec l'âge";
  if(i>=75)return"certains domaines sont à observer";
  return"plusieurs éléments méritent d'être discutés avec un professionnel";
}
function domainName(k){return DOMAINS[k].label.toLowerCase();}
function listFr(a){ if(!a.length)return""; if(a.length===1)return a[0]; return a.slice(0,-1).join(", ")+" et "+a[a.length-1]; }

function buildStrengths(est,ref){ const out=[]; DOMAIN_ORDER.forEach(k=>{ const d=est.domains[k];
  if(d.est>=ref+0.5||d.passRate>=0.8) out.push(STRENGTHS[k]); }); return out; }
function buildWatch(est,ref){ const out=[]; DOMAIN_ORDER.forEach(k=>{ const d=est.domains[k];
  const lower=d.est<=est.maxD-2, below=d.est<ref-0.5, many=d.notyet.length>=2, unk=d.nUnknown>=3;
  if(below||lower||many||unk){ const l=WATCH[k]; out.push(l[0]); if(below&&many&&l[1])out.push(l[1]); } });
  return [...new Set(out)]; }
function buildActivities(est,ref){
  const sup=DOMAIN_ORDER.filter(k=>{ const d=est.domains[k]; return d.est<ref-0.5||d.est<=est.maxD-2||d.notyet.length>=2; });
  let acts=[];
  if(sup.length===0) acts=[ACTIVITIES.cognition[0],ACTIVITIES.social[0],ACTIVITIES.langage[1],ACTIVITIES.fine[0],ACTIVITIES.global[1]];
  else sup.forEach(k=>acts=acts.concat(ACTIVITIES[k].slice(0,2)));
  return [...new Set(acts)].slice(0,7);
}
function buildConclusion(est,cmp,childName){
  const who=childName?childName:"l'enfant";
  const strong=cmp.above.map(domainName);
  const sx=strong.length?(" Certains domaines semblent plus avancés, notamment "+listFr(strong)+"."):"";
  switch(cmp.cat.id){
    case"coherent":return `Les réponses indiquent un profil développemental globalement cohérent avec l'âge de ${who}. Les acquisitions observées correspondent principalement aux attendus de sa tranche d'âge.`+sx;
    case"avance1":return `Les réponses suggèrent que plusieurs acquisitions sont déjà présentes un peu avant l'âge habituellement observé.`+(strong.length?(" Le profil semble donc légèrement en avance, en particulier en "+listFr(strong)+"."):"")+" Cette avance reste indicative et doit être interprétée avec prudence, car le développement est très variable d'un enfant à l'autre.";
    case"avance2":return `Les réponses suggèrent que plusieurs acquisitions sont déjà présentes nettement avant l'âge habituellement observé`+(strong.length?(", en particulier en "+listFr(strong)):"")+`. Le profil semble donc nettement en avance. Cette conclusion reste indicative : les acquisitions précoces ne prédisent pas à elles seules le développement futur.`;
    case"hetero":return `Les réponses montrent un profil hétérogène : certains domaines paraissent plus avancés`+(strong.length?(" ("+listFr(strong)+")"):"")+`, tandis que d'autres semblent moins installés. Ce type de variation peut être normal, mais il mérite une observation attentive dans les prochaines semaines.`;
    case"observer":return `Les réponses montrent que plusieurs acquisitions sont présentes, mais certains domaines semblent moins installés que ce qui est fréquemment observé à cet âge. Cela ne signifie pas automatiquement qu'il existe un problème. Ces points peuvent être observés dans les prochaines semaines ou discutés avec un professionnel si l'inquiétude persiste.`;
    case"pro":return `Plusieurs acquisitions sont présentes, mais certaines réponses méritent un avis professionnel. L'application ne peut pas interpréter seule ces éléments. Il est recommandé d'en parler à un pédiatre, une PMI ou un professionnel de santé, qui pourront observer ${who} dans sa globalité.`;
  }
}
function buildRecommendation(cat){
  switch(cat.id){
    case"coherent":return"Continuez à proposer des moments d'échange, de jeu libre et d'exploration sécurisée. Le profil observé est globalement cohérent avec l'âge indiqué.";
    case"avance1":case"avance2":return"Certaines acquisitions semblent apparaître précocement. L'objectif n'est pas de pousser l'enfant plus vite, mais de lui proposer un environnement riche, sécurisé et adapté à son rythme.";
    case"hetero":case"observer":return"Certains points peuvent être observés dans les prochaines semaines. Vous pouvez proposer des activités simples et en parler à un professionnel si vous restez inquiet.";
    case"pro":return"Certaines réponses justifient de demander un avis professionnel. L'application ne peut pas interpréter seule ces éléments.";
  }
}

let currentRoute={name:'home',params:{}};
function route(name, params){
  currentRoute={name,params:params||{}};
  const fn={ home:renderHome, addchild:renderAddChild, editchild:renderEditChild,
    child:renderChild, evolution:renderEvolution, record:renderRecordView,
    mode:renderMode, quiz:renderQuiz, recap:renderRecap, fix:renderFixQuestion,
    result1:renderResult1, ageform:renderAgeForm, bilan:renderBilan }[name];
  if(fn) fn(params||{});
  scrollTop();
}
function scrollTop(){ window.scrollTo({top:0,behavior:'smooth'}); }
const $app=()=>document.getElementById('app');
function setScreen(html){ $app().innerHTML=`<div class="screen">${html}</div>`; }
function escapeHtml(s){ return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function formatDate(iso){ try{ return new Date(iso).toLocaleDateString('fr-FR',{day:'2-digit',month:'short',year:'numeric'}); }catch(e){ return iso; } }
function fmt(m){ if(m==null)return'—'; return (Math.round(m*10)/10).toString().replace('.0',''); }
function ageFromBirthdate(dob){
  const b=new Date(dob), now=new Date();
  if(isNaN(b)||b>now) return null;
  let months=(now.getFullYear()-b.getFullYear())*12+(now.getMonth()-b.getMonth());
  let days=now.getDate()-b.getDate();
  if(days<0){ months--; days+=30; }
  if(months<0) return null;
  return { months, days:Math.min(days,30) };
}
function animateBars(){
  requestAnimationFrame(()=>{ document.querySelectorAll('.track > i[data-w]').forEach(el=>{ el.style.width=el.dataset.w; }); });
}
function countUp(el, target){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches){ el.textContent=fmt(target); return; }
  const t0=performance.now(), dur=700;
  function tick(t){ const p=Math.min(1,(t-t0)/dur), eased=1-Math.pow(1-p,3);
    el.textContent=fmt(Math.round(target*eased*2)/2);
    if(p<1) requestAnimationFrame(tick); }
  requestAnimationFrame(tick);
}
function celebrate(){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const box=document.createElement('div'); box.className='confetti'; box.setAttribute('aria-hidden','true');
  const emo=["🎉","✨","🌟","💛","🎈","⭐"];
  for(let i=0;i<16;i++){ const s=document.createElement('span');
    s.textContent=emo[i%emo.length];
    s.style.left=(4+Math.random()*92)+'vw';
    s.style.animationDelay=(Math.random()*0.5)+'s';
    s.style.animationDuration=(1.2+Math.random()*0.9)+'s';
    box.appendChild(s); }
  document.body.appendChild(box);
  setTimeout(()=>box.remove(),2600);
}

/* --- Tableau de bord d'un enfant --- */
function renderChild(p){
  const c=getChild(p.id); if(!c){ route('home'); return; }
  store.activeChildId=c.id;
  const recs=c.records; const last=recs[recs.length-1];
  const age=c.birthdate?ageFromBirthdate(c.birthdate):null;
  const pending=loadSession();
  const hasPending=pending && pending.s && pending.s.childId===c.id;

  let html=`<div class="card">
    <div class="row" style="align-items:center">
      <div class="avatar-circle" style="width:64px;height:64px;font-size:2rem">${c.avatar||'🐣'}</div>
      <div class="grow">
        <h2 style="margin:0">${escapeHtml(c.name)}</h2>
        <p class="muted small">${age?`${age.months} mois${age.days?` et ${age.days} j`:''} · `:''}${recs.length} bilan${recs.length>1?'s':''}</p>
      </div>
      <button class="btn btn-soft btn-sm" id="edit-child" aria-label="Modifier le profil">✏️ Modifier</button>
    </div>
    ${hasPending?`<div class="resume-card">
      <strong>⏳ Un bilan est en cours</strong>
      <p class="muted small" style="margin:4px 0 10px">Vous pouvez le reprendre là où vous vous étiez arrêté.</p>
      <div class="btn-row" style="margin-top:0">
        <button class="btn btn-primary btn-sm" id="resume-bilan">Reprendre le bilan</button>
        <button class="btn btn-soft btn-sm" id="discard-bilan" style="flex:0 0 auto">Abandonner</button>
      </div></div>`:''}
    <div class="btn-row">
      <button class="btn btn-primary" id="new-bilan">➕ Nouveau bilan</button>
      ${recs.length>=2?`<button class="btn btn-ghost" id="see-evo">📈 Voir l'évolution</button>`:''}
    </div>
  </div>`;

  if(last){
    html+=`<div class="card tight">
      <h3 style="margin-top:0">Dernier bilan — ${formatDate(last.date)}</h3>
      <div class="summary-grid">
        <div class="stat"><div class="k">Âge réel</div><div class="v">${fmt(last.realMonths)} <small>m</small></div></div>
        ${last.corr!=null?`<div class="stat"><div class="k">Âge corrigé</div><div class="v">${last.corr} <small>m</small></div></div>`:''}
        <div class="stat"><div class="k">Estimé</div><div class="v">${last.est.rangeLow}–${last.est.rangeHigh} <small>m</small></div></div>
      </div>
      <div class="center" style="margin-top:14px"><span class="badge ${last.cmp.cat.badge}" style="animation:none">${last.cmp.cat.emoji} ${last.cmp.cat.label}</span></div>
    </div>`;
  }

  if(recs.length){
    html+=`<div class="card tight"><h3 style="margin-top:0">Historique</h3>
      ${recs.slice().reverse().map(r=>`
        <button class="hist-item" data-rec="${r.id}">
          <span class="d">${formatDate(r.date)}</span>
          <span class="a">~${r.est.roundedOverall} mois</span>
          <span class="b"><span class="badge mini-badge ${r.cmp.cat.badge}">${r.cmp.cat.label}</span></span>
        </button>`).join('')}
    </div>`;
  }

  html+=`<div class="card tight no-print"><div class="btn-row" style="margin-top:0">
      <button class="btn btn-soft" id="back-home">← Tous les enfants</button>
    </div></div>`;

  setScreen(html);
  document.getElementById('new-bilan').onclick=()=>{
    if(hasPending && !confirm("Un bilan est déjà en cours. En commencer un nouveau l'effacera. Continuer ?")) return;
    clearSession(); newSession(c.id,null); route('mode',{});
  };
  if(hasPending){
    document.getElementById('resume-bilan').onclick=()=>resumeSession(pending);
    document.getElementById('discard-bilan').onclick=()=>{ clearSession(); route('child',{id:c.id}); };
  }
  const evo=document.getElementById('see-evo'); if(evo) evo.onclick=()=>route('evolution',{id:c.id});
  document.querySelectorAll('.hist-item[data-rec]').forEach(b=>b.onclick=()=>route('record',{id:c.id,rec:b.dataset.rec}));
  document.getElementById('back-home').onclick=()=>route('home');
  document.getElementById('edit-child').onclick=()=>route('editchild',{id:c.id});
}

function resumeSession(saved){
  session=saved.s;
  Object.assign(quiz, saved.q||{});
  const stage=session.stage||'quiz';
  if(stage==='quiz'||stage==='flags') route('quiz',{});
  else if(stage==='recap') route('recap',{});
  else if(stage==='result1'){ session.est=runEstimation(session.answers,session.flags); route('result1',{}); }
  else if(stage==='ageform'){ session.est=runEstimation(session.answers,session.flags); route('ageform',{next:'bilan'}); }
  else route('quiz',{});
}

/* ============================================================
   9. QUIZ adaptatif
============================================================ */
const quiz={di:0,mi:0,consecNo:0,phase:'milestones',fi:0};
function startQuiz(){ quiz.di=0;quiz.mi=0;quiz.consecNo=0;quiz.phase='milestones';quiz.fi=0;
  session.stage='quiz'; saveSession(); route('quiz',{}); }
function currentDomainMs(){ const key=DOMAIN_ORDER[quiz.di]; return MILESTONES.filter(m=>m.d===key).sort((a,b)=>a.age-b.age); }
function answeredCount(){ return Object.keys(session.answers).length; }
function dotsHtml(){
  return `<div class="dots" aria-hidden="true">${DOMAIN_ORDER.map((k,i)=>{
    const cls = quiz.phase==='flags' ? 'done' : (i<quiz.di?'done':(i===quiz.di?'now':''));
    return `<span class="dot ${cls}">${DOMAINS[k].emoji}</span>`; }).join('')}
    <span class="dot ${quiz.phase==='flags'?'now':''}">🛟</span></div>`;
}

function renderQuiz(){
  if(quiz.phase==='flags') return renderFlagQuestion();
  const key=DOMAIN_ORDER[quiz.di]; const ms=currentDomainMs();
  if(quiz.mi>=ms.length){ quiz.di++; quiz.mi=0; quiz.consecNo=0;
    if(quiz.di>=DOMAIN_ORDER.length){ quiz.phase='flags'; quiz.fi=0; } return renderQuiz(); }
  const m=ms[quiz.mi]; const dom=DOMAINS[key];
  const c=getChild(session.childId);
  const who=c?escapeHtml(c.name):"Votre enfant";
  const totalApprox=MILESTONES.length+FLAG_QUESTIONS.length;
  const done=answeredCount()+Object.keys(session.flags).length;
  const pct=Math.min(98,Math.round(done/totalApprox*100));
  setScreen(`<div class="card question">
    ${dotsHtml()}
    <div class="domain-pill">${dom.emoji} ${dom.label}</div>
    <div class="progress"><i style="width:${pct}%"></i></div>
    <div class="progress-label">${done} / ~${totalApprox}</div>
    <h2>${who} : ${m.t} ?</h2>
    <div class="answers" id="answers" role="group" aria-label="Réponse">
      <button class="ans yes" data-v="oui"><span class="em">😊</span> Oui, il/elle le fait</button>
      <button class="ans no" data-v="non"><span class="em">🕓</span> Pas encore</button>
      <button class="ans unknown" data-v="idk"><span class="em">🤔</span> Je ne sais pas</button>
    </div>
    <div class="quiz-foot">
      <button class="link-btn" id="back" ${(quiz.di===0&&quiz.mi===0)?'style="visibility:hidden"':''}>← Précédent</button>
      <button class="link-btn" id="quit">Mettre en pause</button>
    </div></div>`);
  const box=document.getElementById('answers');
  box.querySelectorAll('.ans').forEach(b=> b.onclick=()=>{
    box.classList.add('locked'); b.classList.add('picked');
    setTimeout(()=>answerMilestone(m,b.dataset.v),150);
  });
  document.getElementById('quit').onclick=pauseQuiz;
  const back=document.getElementById('back'); if(back) back.onclick=quizBack;
}
function pauseQuiz(){ saveSession(); route('child',{id:session.childId}); }
function answerMilestone(m,v){
  session.answers[m.id]=v;
  if(v==='non')quiz.consecNo++; else if(v==='oui')quiz.consecNo=0;
  const ms=currentDomainMs();
  if(quiz.consecNo>=2){ for(let i=quiz.mi+1;i<ms.length;i++){ if(!session.answers[ms[i].id])session.answers[ms[i].id]='non'; }
    quiz.mi=ms.length; quiz.consecNo=0; } else quiz.mi++;
  saveSession();
  renderQuiz();
}
function quizBack(){
  if(quiz.phase==='flags'){
    if(quiz.fi>0){ quiz.fi--; delete session.flags[FLAG_QUESTIONS[quiz.fi].id]; saveSession(); return renderQuiz(); }
    quiz.phase='milestones'; quiz.di=DOMAIN_ORDER.length-1; quiz.mi=currentDomainMs().length-1; quiz.consecNo=0; saveSession(); return renderQuiz();
  }
  if(quiz.mi>0)quiz.mi--; else if(quiz.di>0){ quiz.di--; quiz.mi=currentDomainMs().length-1; }
  quiz.consecNo=0; saveSession(); renderQuiz();
}
function renderFlagQuestion(){
  if(quiz.fi>=FLAG_QUESTIONS.length){ session.stage='recap'; saveSession(); return route('recap',{}); }
  const f=FLAG_QUESTIONS[quiz.fi];
  const totalApprox=MILESTONES.length+FLAG_QUESTIONS.length;
  const done=answeredCount()+Object.keys(session.flags).length;
  const pct=Math.min(99,Math.round(done/totalApprox*100));
  setScreen(`<div class="card question">
    ${dotsHtml()}
    <div class="domain-pill">🛟 Quelques questions de repérage</div>
    <div class="progress"><i style="width:${pct}%"></i></div>
    <div class="progress-label">${done} / ~${totalApprox}</div>
    <h2>${f.t}</h2>
    <div class="answers" id="answers" role="group" aria-label="Réponse">
      <button class="ans yes" data-v="oui"><span class="em">👍</span> Oui</button>
      <button class="ans no" data-v="non"><span class="em">👎</span> Non</button>
    </div>
    <div class="quiz-foot"><button class="link-btn" id="back">← Précédent</button>
      <button class="link-btn" id="quit">Mettre en pause</button></div></div>`);
  const box=document.getElementById('answers');
  box.querySelectorAll('.ans').forEach(b=> b.onclick=()=>{
    box.classList.add('locked'); b.classList.add('picked');
    setTimeout(()=>{ session.flags[f.id]=b.dataset.v; quiz.fi++; saveSession(); renderQuiz(); },150);
  });
  document.getElementById('quit').onclick=pauseQuiz;
  document.getElementById('back').onclick=quizBack;
}

/* ============================================================

function renderRecap(){

  setScreen(`<div class="card">

      ${counts.map(c=>`<div class="recap-cell"><div class="e">${DOMAINS[c.k].emoji}</div>

    </div>
    ${uncertain.length?`<h3>❔ Réponses « je ne sais pas » (${uncertain.length})</h3>

      ${uncertain.map(m=>`<button class="fix-item" data-id="${m.id}">
        <span>${DOMAINS[m.d].emoji}</span><span>${m.t}</span><span class="go">Préciser →</span></button>`).join('')}`

    <div class="btn-row">

}

/* ============================================================
   11. RÉSULTAT Phase 1
============================================================ */
function domainBars(est, refAge){
  return `<div class="bars">${DOMAIN_ORDER.map(k=>{
    const d=est.domains[k],dom=DOMAINS[k]; const pct=clamp((d.est-3)/9*100,3,100);
    const ref=(refAge!=null)?`<div class="refline" style="left:${clamp((refAge-3)/9*100,0,100)}%"></div>`:"";
    return `<div class="bar-row"><div class="lab"><span>${dom.emoji} ${dom.label}</span><span class="age">~${Math.round(d.est*2)/2} mois</span></div>
      <div class="track"><i data-w="${pct}%"></i>${ref}</div></div>`;
  }).join('')}<div class="scale"><span>3 mois</span><span>7-8 mois</span><span>12 mois</span></div></div>`;
}
function listMs(arr,cls){ if(!arr.length)return'<p class="muted">—</p>';
  return `<ul class="clean ${cls}">${arr.map(m=>`<li>${DOMAINS[m.d].emoji} ${m.t}</li>`).join('')}</ul>`; }

function renderResult1(){
  const est=session.est; const cc=est.confidence;
  const confClass=cc==='élevé'?'eleve':(cc==='moyen'?'moyen':'faible');
  const ordered=DOMAIN_ORDER.slice().sort((a,b)=>est.domains[b].est-est.domains[a].est);
  const top=domainName(ordered[0]),low=domainName(ordered[ordered.length-1]);
  const lecture=`Les réponses correspondent principalement à des acquisitions observées autour de ${est.roundedOverall} mois. Certains éléments semblent plus présents en ${top}, tandis que la ${low} paraît un peu moins installée.`;
  setScreen(`<div class="card">
    <h2>🙈 Estimation à l'aveugle</h2>
    <p class="muted">Première estimation produite <strong>sans connaître l'âge réel</strong>.</p>
    <div class="age-hero"><div class="big">~ <span id="bignum">0</span> <small>mois</small></div>
      <div class="range">Fourchette probable : entre <strong>${est.rangeLow}</strong> et <strong>${est.rangeHigh}</strong> mois</div>
      <div class="conf ${confClass}">Score de confiance : ${cc}</div></div>
    <div class="prudence">${lecture}</div>
    <h3>Profil par domaine</h3>${domainBars(est,null)}
    <div class="prudence">Cette estimation est indicative. Les enfants ne progressent pas tous au même rythme.</div>
  </div>
  <div class="card">
    <details class="tech"><summary>✅ Acquisitions déjà présentes (${est.present.length})</summary>${listMs(est.present,'yes')}</details>
    <details class="tech"><summary>🕓 Acquisitions non encore observées (${est.absent.length})</summary>${est.absent.length?listMs(est.absent,'no'):'<p class="muted">Aucune.</p>'}</details>
    ${est.uncertain.length?`<details class="tech"><summary>❔ Réponses incertaines (${est.uncertain.length})</summary>${listMs(est.uncertain,'unk')}</details>`:''}
  </div>
  <div class="card center">
    <h2>Comparez avec l'âge réel</h2>

    <button class="btn btn-primary btn-block" id="go" style="margin-top:14px">Comparer avec l'âge réel →</button>
  </div>`);
  countUp(document.getElementById('bignum'), est.roundedOverall);

  document.getElementById('go').onclick=()=>{ session.stage='ageform'; saveSession(); route('ageform',{next:'bilan'}); };
}

/* ============================================================

    </div>

      <div class="radio-row" id="prem" role="group" aria-labelledby="prem-lab">
        <button type="button" class="radio-chip ${s.premature==='non'?'sel':''}" data-v="non">Non</button>
        <button type="button" class="radio-chip ${s.premature==='oui'?'sel':''}" data-v="oui">Oui</button>
        <button type="button" class="radio-chip ${s.premature==='idk'?'sel':''}" data-v="idk">Je ne sais pas</button></div></div>
    <div class="field ${s.premature==='oui'?'':'hidden'}" id="pwf">
      <label for="premweeks">Nombre de semaines de prématurité <span class="hint">(par rapport à 40 semaines)</span></label>
      <div class="inputs"><input type="number" inputmode="numeric" id="premweeks" min="1" max="16" placeholder="semaines" value="${s.premWeeks||''}"> <span class="muted">semaines</span></div>
      <div class="corrected-note" id="corrnote"></div></div>
    <p id="formerr" class="muted" style="color:var(--red);min-height:1em" role="alert"></p>
    <div class="btn-row"><button class="btn btn-soft" id="cancel" style="flex:0 0 auto">← Retour</button>
      <button class="btn btn-primary" id="submit">${next==='quiz'?'Commencer le questionnaire →':'Voir le bilan ✨'}</button></div>
  </div>`);
  const prem=document.getElementById('prem');

  function updateCorr(){ const note=document.getElementById('corrnote'); if(!note)return;
    const m=parseFloat(document.getElementById('months').value);
    const w=parseFloat((document.getElementById('premweeks')||{}).value);

    else note.style.display='none'; }

    if(!s.premature){ err.textContent="Merci d'indiquer si l'enfant est né prématurément."; return; }
    if(m<3||m>13) err.textContent="Note : l'outil est calibré pour 3 à 12 mois, l'analyse sera moins fiable hors de cette tranche.";

    if(s.premature==='oui'){ const w=parseFloat(document.getElementById('premweeks').value);
      if(isNaN(w)||w<=0){ err.textContent="Merci d'indiquer le nombre de semaines de prématurité."; return; } s.premWeeks=w; }

      c.premature=s.premature; c.premWeeks=s.premWeeks; saveStore(); }
    if(next==='quiz') startQuiz(); else route('bilan',{});
  };
}

/* ============================================================
   13. BILAN — calcule, enregistre, affiche
============================================================ */
function computeRecordFromSession(){
  const s=session; const est=s.est;
  const corr=(s.premature==='oui'&&s.premWeeks>0)?Math.max(0,Math.round((s.realMonths-s.premWeeks/4.345)*10)/10):null;
  const ref=(corr!=null)?corr:s.realMonths;
  const cmp=buildComparison(est, s.answers, ref, corr);
  const domainEst={}; DOMAIN_ORDER.forEach(k=>domainEst[k]=Math.round(est.domains[k].est*100)/100);
  return {
    date:new Date().toISOString(), mode:s.mode,
    realMonths:s.realMonths, realDays:s.realDays, premature:s.premature, premWeeks:s.premWeeks, corr, ref,
    est:{ overall:Math.round(est.overall*100)/100, roundedOverall:est.roundedOverall, rangeLow:est.rangeLow,
      rangeHigh:est.rangeHigh, confidence:est.confidence, domains:domainEst,
      present:est.present.length, absent:est.absent.length, uncertain:est.uncertain.length },
    cmp:{ index:cmp.index, diff:Math.round(cmp.diff*100)/100, above:cmp.above, farBelow:cmp.farBelow,
      allAlerts:cmp.allAlerts, cat:{id:cmp.cat.id,label:cmp.cat.label,badge:cmp.cat.badge,emoji:cmp.cat.emoji} }
  };
}

function renderBilan(){
  const s=session;
  if(!s.est) s.est=runEstimation(s.answers,s.flags);
  if(!s._savedRecordId){
    const rec=computeRecordFromSession();
    addRecord(s.childId, rec); s._savedRecordId=rec.id; s._rec=rec;
    clearSession();
  }
  const rec=s._rec; const c=getChild(s.childId);
  renderBilanFromRecord(rec, c, s.est, true);
  if(['coherent','avance1','avance2'].includes(rec.cmp.cat.id)) celebrate();
}

  document.getElementById('export').onclick=()=>exportRecord(window._exp);
  document.getElementById('print').onclick=()=>window.print();
  const del=document.getElementById('del-rec'); if(del) del.onclick=()=>{ if(confirm("Supprimer ce bilan ?")){ deleteRecord(childId,rec.id); route('child',{id:childId}); } };
}

function reconstructEst(rec){
  const domains={}; let min=99,max=0;
  DOMAIN_ORDER.forEach(k=>{ const e=rec.est.domains[k]; min=Math.min(min,e); max=Math.max(max,e);
    domains[k]={ est:e, floor:e, ceiling:e, acquired:[], notyet:[], unknown:[], passRate:0.5, nUnknown:0, total:10 }; });
  return { domains, overall:rec.est.overall, roundedOverall:rec.est.roundedOverall, minD:min, maxD:max,
    spread:max-min, confidence:rec.est.confidence, rangeLow:rec.est.rangeLow, rangeHigh:rec.est.rangeHigh,
    present:[], absent:[], uncertain:[], alerts:rec.cmp.allAlerts||[] };
}

function renderRecordView(p){
  const c=getChild(p.id); if(!c){ route('home'); return; }
  const rec=c.records.find(r=>r.id===p.rec); if(!rec){ route('child',{id:p.id}); return; }
  renderBilanFromRecord(rec, c, null, false);
}

/* ============================================================
   14. ÉVOLUTION — courbes lissées + commentaires automatiques
============================================================ */
function renderEvolution(p){
  const c=getChild(p.id); if(!c||c.records.length<2){ route('child',{id:p?p.id:null}); return; }
  const recs=c.records.slice().sort((a,b)=>new Date(a.date)-new Date(b.date));
  const labels=recs.map(r=>formatDate(r.date));
  const overall=recs.map(r=>r.est.overall);
  const realAge=recs.map(r=>r.ref);
  const domainSeries=DOMAIN_ORDER.map(k=>({label:DOMAINS[k].label,color:DOMAINS[k].color,width:2,values:recs.map(r=>r.est.domains[k])}));
  const mainChart=lineChart(labels,[
    {label:"Âge estimé",color:"#5b7cfa",width:3,values:overall,area:true},
    {label:"Âge de référence",color:"#e26d60",width:2,dashed:true,values:realAge}
  ],{yMin:3,yMax:12,yLabel:"mois"});
  const domChart=lineChart(labels,domainSeries,{yMin:3,yMax:12,yLabel:"mois"});
  const commentary=buildEvolutionCommentary(recs,c.name);
  setScreen(`<div class="card tight">
    <h2>📈 Évolution — ${escapeHtml(c.name)}</h2>
    <p class="muted small">${recs.length} bilans entre le ${formatDate(recs[0].date)} et le ${formatDate(recs[recs.length-1].date)}.</p>
  </div>
  <div class="card"><h3 style="margin-top:0">Âge développemental estimé vs âge de référence</h3>
    <div class="chart-wrap">${mainChart}</div>
    <div class="legend"><span><i style="background:#5b7cfa"></i> Âge estimé</span><span><i style="background:#e26d60"></i> Âge de référence (réel/corrigé)</span></div>
  </div>
  <div class="card"><h3 style="margin-top:0">Évolution par domaine</h3>
    <div class="chart-wrap">${domChart}</div>
    <div class="legend">${DOMAIN_ORDER.map(k=>`<span><i style="background:${DOMAINS[k].color}"></i> ${DOMAINS[k].label}</span>`).join('')}</div>
  </div>
  <div class="card"><h2>Ce qui a évolué</h2>${commentary}</div>
  <div class="card tight no-print"><div class="btn-row" style="margin-top:0">
    <button class="btn btn-soft" id="back">← Retour au profil</button>
    <button class="btn btn-ghost" id="print">🖨️ Imprimer / PDF</button>
  </div></div>`);
  document.getElementById('back').onclick=()=>route('child',{id:c.id});
  document.getElementById('print').onclick=()=>window.print();
}

function buildEvolutionCommentary(recs, name){
  const who=name||"votre enfant";
  const first=recs[0], last=recs[recs.length-1], prev=recs[recs.length-2];
  let html="";
  const dOverall=Math.round((last.est.overall-first.est.overall)*10)/10;
  let trend;
  if(dOverall>=0.4) trend=`Depuis le premier bilan, l'âge développemental estimé de ${escapeHtml(who)} est passé d'environ ${first.est.roundedOverall} à ${last.est.roundedOverall} mois — une progression visible. 🎉`;
  else if(dOverall<=-0.4) trend=`L'estimation globale a légèrement reculé (de ${first.est.roundedOverall} à ${last.est.roundedOverall} mois). Cela peut venir de jours moins en forme ou de réponses « je ne sais pas » : à observer sur les prochains bilans.`;
  else trend=`L'âge développemental estimé est resté stable (autour de ${last.est.roundedOverall} mois) depuis le premier bilan.`;
  html+=`<p class="conclusion">${trend}</p>`;
  if(prev){
    const ups=[],flats=[],downs=[];
    DOMAIN_ORDER.forEach(k=>{ const delta=Math.round((last.est.domains[k]-prev.est.domains[k])*10)/10;
      if(delta>=0.5)ups.push({k,delta}); else if(delta<=-0.5)downs.push({k,delta}); else flats.push(k); });
    html+=`<h3>Depuis le bilan précédent (${formatDate(prev.date)})</h3><div>`;
    ups.forEach(u=> html+=`<span class="pill-note">📈 ${DOMAINS[u.k].label} : +${u.delta} mois</span>`);
    flats.forEach(k=> html+=`<span class="pill-note pill-flat">➡️ ${DOMAINS[k].label} : stable</span>`);
    downs.forEach(d=> html+=`<span class="pill-note pill-warn">👀 ${DOMAINS[d.k].label} : à surveiller</span>`);
    html+=`</div>`;
    if(ups.length) html+=`<p class="conclusion" style="margin-top:12px">Belle progression en ${listFr(ups.map(u=>domainName(u.k)))}. Continuez les activités qui fonctionnent !</p>`;
    if(downs.length) html+=`<p class="conclusion">En ${listFr(downs.map(d=>domainName(d.k)))}, l'estimation est un peu plus basse que la dernière fois. Ce n'est pas forcément un recul réel : à reproposer en jeu, et à observer sur le prochain bilan.</p>`;
  }
  const aboveNames=last.cmp.above.map(domainName);
  if(aboveNames.length) html+=`<p class="conclusion">Au dernier bilan, ${escapeHtml(who)} semble en avance en ${listFr(aboveNames)} par rapport à son âge de référence.</p>`;
  html+=`<div class="prudence">Ces tendances sont indicatives. Un seul bilan ne dit pas grand-chose ; c'est la régularité dans le temps qui est intéressante. En cas d'inquiétude, parlez-en à un professionnel.</div>`;
  return html;
}

/* SVG line chart — courbes lissées, aire dégradée, sans dépendance */
function smoothPath(pts){
  if(pts.length<3) return 'M'+pts.map(p=>p.x+','+p.y).join(' L');
  let d=`M${pts[0].x},${pts[0].y}`;
  for(let i=0;i<pts.length-1;i++){
    const p0=pts[Math.max(0,i-1)],p1=pts[i],p2=pts[i+1],p3=pts[Math.min(pts.length-1,i+2)];
    const c1x=p1.x+(p2.x-p0.x)/6,c1y=p1.y+(p2.y-p0.y)/6;
    const c2x=p2.x-(p3.x-p1.x)/6,c2y=p2.y-(p3.y-p1.y)/6;
    d+=`C${c1x.toFixed(1)},${c1y.toFixed(1)} ${c2x.toFixed(1)},${c2y.toFixed(1)} ${p2.x},${p2.y}`;
  }
  return d;
}
let _gradSeq=0;
function lineChart(labels, series, opts){
  const W=640,H=260,pad={l:38,r:14,t:14,b:42};
  const yMin=opts.yMin,yMax=opts.yMax,n=labels.length;
  const plotW=W-pad.l-pad.r,plotH=H-pad.t-pad.b;
  const x=i=> +(pad.l + (n<=1?plotW/2:(i/(n-1))*plotW)).toFixed(1);
  const y=v=> +(pad.t + (1-(clamp(v,yMin,yMax)-yMin)/(yMax-yMin))*plotH).toFixed(1);
  let grid="";
  for(let g=yMin;g<=yMax;g+=(yMax-yMin)<=9?1:2){
    const yy=y(g);
    grid+=`<line x1="${pad.l}" y1="${yy}" x2="${W-pad.r}" y2="${yy}" stroke="var(--chart-grid)"/>`+
      `<text x="${pad.l-6}" y="${yy+3}" text-anchor="end" font-size="9" fill="var(--chart-text)">${g}</text>`;
  }
  let xlabels="";
  labels.forEach((l,i)=>{ if(n>6 && i%Math.ceil(n/6)!==0 && i!==n-1) return;
    xlabels+=`<text x="${x(i)}" y="${H-pad.b+16}" text-anchor="middle" font-size="8.5" fill="var(--chart-text)">${escapeHtml(l)}</text>`; });
  let defs="",paths="";
  series.forEach(s=>{
    const pts=s.values.map((v,i)=>({x:x(i),y:y(v)}));
    const d=smoothPath(pts);
    if(s.area && pts.length>1){
      const gid="grad"+(++_gradSeq);
      defs+=`<linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="${s.color}" stop-opacity=".22"/>
        <stop offset="100%" stop-color="${s.color}" stop-opacity="0"/></linearGradient>`;
      paths+=`<path d="${d} L${pts[pts.length-1].x},${H-pad.b} L${pts[0].x},${H-pad.b} Z" fill="url(#${gid})" stroke="none"/>`;
    }
    paths+=`<path d="${d}" fill="none" stroke="${s.color}" stroke-width="${s.width||2}" ${s.dashed?'stroke-dasharray="5 4"':''} stroke-linejoin="round" stroke-linecap="round"/>`;
    pts.forEach(p=> paths+=`<circle cx="${p.x}" cy="${p.y}" r="${(s.width||2)+1}" fill="${s.color}"/>`);
  });
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Graphique d'évolution"><defs>${defs}</defs>${grid}${paths}${xlabels}
    <text x="10" y="12" font-size="9" fill="var(--chart-text)">${opts.yLabel||''}</text></svg>`;
}

/* ============================================================
   15. EXPORT
============================================================ */
function exportRecord(exp){
  const {rec,strengths,watch,activities,conclusion,reco,childName}=exp;
  const L=[];
  L.push("BILAN DÉVELOPPEMENTAL INDICATIF (non médical)");
  if(childName) L.push("Enfant : "+childName);
  L.push("Date : "+formatDate(rec.date));
  L.push("=".repeat(48));L.push("");
  L.push("RÉSUMÉ");
  L.push("- Âge réel : "+fmt(rec.realMonths)+" mois"+(rec.realDays?(" et "+rec.realDays+" jours"):""));
  if(rec.corr!=null) L.push("- Âge corrigé : "+rec.corr+" mois");
  L.push("- Âge développemental estimé : "+rec.est.rangeLow+" à "+rec.est.rangeHigh+" mois (~"+rec.est.roundedOverall+")");
  L.push("- Indice de cohérence : "+rec.cmp.index+"% — "+indexReading(rec.cmp.index));
  L.push("- Confiance : "+rec.est.confidence);
  L.push("- Classification : "+rec.cmp.cat.label);L.push("");
  L.push("PROFIL PAR DOMAINE");
  DOMAIN_ORDER.forEach(k=>L.push("- "+DOMAINS[k].label+" : ~"+(Math.round(rec.est.domains[k]*2)/2)+" mois"));
  L.push("");L.push("CONCLUSION");L.push(conclusion);L.push("");
  L.push("FORCES OBSERVÉES");(strengths.length?strengths:["—"]).forEach(s=>L.push("- "+s));L.push("");
  L.push("POINTS À OBSERVER / ACCOMPAGNER");(watch.length?watch:["—"]).forEach(w=>L.push("- "+w));L.push("");
  L.push("ACTIVITÉS CONSEILLÉES");activities.forEach(a=>L.push("- "+a));L.push("");
  if(rec.cmp.allAlerts.length){ L.push("À DISCUTER AVEC UN PROFESSIONNEL");rec.cmp.allAlerts.forEach(a=>L.push("- "+a));L.push(""); }
  L.push("RECOMMANDATION");L.push(reco);L.push("");
  L.push("-".repeat(48));
  L.push("Outil indicatif et non médical. Il ne pose aucun diagnostic.");
  L.push("En cas de doute, parlez-en à un pédiatre, un médecin ou une PMI.");
  const blob=new Blob([L.join("\n")],{type:"text/plain;charset=utf-8"});
  const url=URL.createObjectURL(blob); const a=document.createElement('a');
  a.href=url; a.download="bilan-"+(childName?childName.replace(/\s+/g,'-').toLowerCase()+"-":"")+rec.date.slice(0,10)+".txt"; a.click();
  URL.revokeObjectURL(url);
}
